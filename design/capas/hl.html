<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter+Tight:wght@400;500&display=block" rel="stylesheet" />
<style>
  html { zoom: 2; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1600px; height: 900px; overflow: hidden; font-family: "Inter Tight", Arial, sans-serif; }
  .bg { position: absolute; inset: 0; background: linear-gradient(135deg, #ff7a1a 0%, #f2610f 38%, #a43fc9 78%, #7b2cbf 100%); }
  .blob1 { position: absolute; right: -140px; top: -180px; width: 720px; height: 720px; border-radius: 50%; background: rgba(255,255,255,.10); }
  .blob2 { position: absolute; left: 520px; bottom: -380px; width: 760px; height: 760px; border-radius: 50%; background: rgba(123,44,191,.35); }
  .noise { position: absolute; inset: 0; opacity: .10; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .copy { position: absolute; left: 100px; top: 200px; width: 520px; color: #fff; }
  .eyebrow { font: 700 18px "Space Grotesk"; letter-spacing: .32em; color: #ffe2cc; }
  h1 { margin-top: 24px; font: 700 100px/0.92 "Space Grotesk"; letter-spacing: -0.045em; }
  .sub { margin-top: 26px; font-size: 25px; line-height: 1.35; color: #fff3ea; max-width: 470px; }
  .chips { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 10px; max-width: 520px; }
  .chips span { padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); font-size: 17px; color: #fff; }
  .laptop { position: absolute; left: 640px; top: 150px; width: 900px; transform: perspective(2000px) rotateY(-12deg) rotateX(4deg); transform-origin: left center; }
  .screen { padding: 14px 14px 18px; border-radius: 22px 22px 8px 8px; background: #16161b; box-shadow: 0 60px 100px -40px rgba(40,10,60,.7); }
  .screen img { display: block; width: 100%; height: 470px; object-fit: cover; object-position: top left; border-radius: 6px; }
  .base { height: 20px; margin: 0 -50px; border-radius: 0 0 26px 26px; background: linear-gradient(#d9d9de, #9d9da6); box-shadow: 0 30px 50px -20px rgba(40,10,60,.6); }
  .phone { position: absolute; padding: 7px; border-radius: 30px; background: #0b0b10; box-shadow: 0 40px 70px -24px rgba(40,10,60,.75); }
  .phone img { display: block; width: 150px; height: 309px; border-radius: 24px; object-fit: cover; }
  .ph1 { left: 1080px; top: 470px; transform: rotate(-8deg); }
  .ph2 { left: 1250px; top: 420px; z-index: 2; transform: rotate(2deg) scale(1.08); }
  .ph3 { left: 1410px; top: 480px; transform: rotate(9deg); }
</style>
</head>
<body>
  <div class="bg"></div><div class="blob1"></div><div class="blob2"></div><div class="noise"></div>
  <div class="copy">
    <div class="eyebrow">HORA DO LAR</div>
    <h1>Site novo<br />+ 2 apps</h1>
    <p class="sub">Gestão de empregados domésticos sem juridiquês, para quem emprega e para quem trabalha.</p>
    <div class="chips"><span>Homepage</span><span>App do funcionário</span><span>App do empregador</span></div>
  </div>
  <div class="laptop"><div class="screen"><img src="hl-hero.png" alt="" /></div><div class="base"></div></div>
  <div class="phone ph1"><img src="app-menu.png" alt="" /></div>
  <div class="phone ph2"><img src="app-ponto.png" alt="" /></div>
  <div class="phone ph3"><img src="app-resumo.png" alt="" /></div>
</body>
</html>
