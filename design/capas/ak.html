<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter+Tight:wght@400;500&display=block" rel="stylesheet" />
<style>
  html { zoom: 2; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1600px; height: 900px; overflow: hidden; font-family: "Inter Tight", Arial, sans-serif; }
  .bg { position: absolute; inset: 0; background: radial-gradient(1000px 700px at 75% 45%, #1f5fb8 0%, #0b3a75 50%, #061f42 100%); }
  .grid { position: absolute; inset: 0; opacity: .14;
    background-image: linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
    background-size: 64px 64px; mask-image: radial-gradient(700px 500px at 75% 50%, #000, transparent); }
  .copy { position: absolute; left: 100px; top: 200px; width: 620px; color: #fff; }
  .eyebrow { font: 700 18px "Space Grotesk"; letter-spacing: .32em; color: #bcd6ff; }
  h1 { margin-top: 24px; font: 700 92px/0.94 "Space Grotesk"; letter-spacing: -0.045em; }
  .sub { margin-top: 26px; font-size: 25px; line-height: 1.35; color: #e3eeff; max-width: 520px; }
  .chips { margin-top: 34px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chips span { padding: 12px 18px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); font-size: 18px; color: #fff; }
  .phone { position: absolute; padding: 9px; border-radius: 44px; background: #05080f; box-shadow: 0 50px 90px -30px rgba(0,10,40,.85); }
  .phone img { display: block; width: 250px; height: 548px; object-fit: cover; object-position: top; border-radius: 36px; background: #fff; }
  .a { left: 860px; top: 200px; transform: rotate(-7deg) scale(.9); }
  .b { left: 1080px; top: 120px; z-index: 2; }
  .c { left: 1310px; top: 210px; transform: rotate(7deg) scale(.9); }
</style>
</head>
<body>
  <div class="bg"></div><div class="grid"></div>
  <div class="copy">
    <div class="eyebrow">AKAMAI · EXBIZ</div>
    <h1>Segurança<br />no bolso</h1>
    <p class="sub">Painel de firewall de aplicação web levado para o celular, com um mini design system próprio.</p>
    <div class="chips"><span>Ataques e tráfego</span><span>Filtro por contrato</span><span>Design system</span></div>
  </div>
  <div class="phone a"><img src="login.webp" alt="" /></div>
  <div class="phone b"><img src="waf-resumo.webp" alt="" /></div>
  <div class="phone c"><img src="trafego.webp" alt="" /></div>
</body>
</html>
