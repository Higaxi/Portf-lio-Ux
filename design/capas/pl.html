<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter+Tight:wght@400;500&display=block" rel="stylesheet" />
<style>
  html { zoom: 2; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1600px; height: 900px; overflow: hidden; font-family: "Inter Tight", Arial, sans-serif; }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(1100px 700px at 78% 45%, #3b56ff 0%, #1e3bff 45%, #1229c9 100%);
  }
  .noise { position: absolute; inset: 0; opacity: .12; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .pitch { position: absolute; left: 760px; top: 60px; width: 820px; height: 780px; border: 2px solid rgba(255,255,255,.10); border-radius: 18px; }
  .pitch::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid rgba(255,255,255,.10); }
  .pitch::after { content: ""; position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px; border: 2px solid rgba(255,255,255,.10); border-radius: 50%; }
  .box { position: absolute; left: 50%; width: 360px; height: 120px; margin-left: -180px; border: 2px solid rgba(255,255,255,.10); }
  .box.t { top: -2px; border-top: 0; } .box.b { bottom: -2px; border-bottom: 0; }
  .copy { position: absolute; left: 110px; top: 190px; width: 640px; color: #fff; }
  .eyebrow { font: 700 18px "Space Grotesk"; letter-spacing: .32em; color: #c7d2fe; }
  h1 { margin-top: 26px; font: 700 104px/0.92 "Space Grotesk"; letter-spacing: -0.045em; }
  .sub { margin-top: 28px; font-size: 26px; line-height: 1.35; color: #e0e7ff; max-width: 520px; }
  .claim { margin-top: 40px; display: inline-flex; align-items: center; gap: 16px; padding: 16px 24px 16px 16px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); }
  .claim b { display: inline-flex; align-items: center; justify-content: center; height: 52px; padding: 0 18px; border-radius: 999px; background: #facc15; color: #111; font: 700 26px "Space Grotesk"; letter-spacing: -0.02em; }
  .claim span { font-size: 21px; line-height: 1.25; color: #fff; }
  .stage { position: absolute; left: 820px; top: 0; width: 780px; height: 900px; perspective: 1800px; }
  .phone { position: absolute; padding: 9px; border-radius: 46px; background: #0b0b10; box-shadow: 0 50px 90px -30px rgba(5,10,60,.75), 0 0 0 2px rgba(255,255,255,.08) inset; }
  .phone img { display: block; border-radius: 38px; }
  .p-before { left: 40px; top: 210px; transform: rotateY(24deg) rotateZ(-4deg) scale(.86); filter: saturate(.9) brightness(.92); }
  .p-before img { width: 236px; height: 510px; object-fit: cover; }
  .p-splash { left: 470px; top: 170px; transform: rotateY(-22deg) rotateZ(4deg) scale(.84); }
  .p-splash img { width: 256px; height: 530px; object-fit: cover; }
  .p-after { left: 228px; top: 92px; z-index: 2; }
  .p-after img { width: 318px; height: 728px; object-fit: cover; }
  .tag { position: absolute; z-index: 3; font: 500 15px "Inter Tight"; color: #fff; background: rgba(10,15,60,.55); border: 1px solid rgba(255,255,255,.2); padding: 8px 14px; border-radius: 999px; }
  .tag.a { left: 60px; top: 760px; } .tag.b { left: 440px; top: 836px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="pitch"><div class="box t"></div><div class="box b"></div></div>
  <div class="noise"></div>
  <div class="copy">
    <div class="eyebrow">PREMIUM LEAGUE</div>
    <h1>Redesign +<br />Design System</h1>
    <p class="sub">Fantasy game de futebol com o novo design system, no app e no desktop.</p>
    <div class="claim"><b>5 de 8</b><span>oportunidades da pesquisa<br />viraram plano PRO</span></div>
  </div>
  <div class="stage">
    <div class="phone p-before"><img src="pl-antes@3x.png" alt="" /></div>
    <div class="phone p-splash"><img src="pl-splash@3x.png" alt="" /></div>
    <div class="phone p-after"><img src="pl-depois@3x.png" alt="" /></div>
    <div class="tag a">Antes</div>
    <div class="tag b">Depois</div>
  </div>
</body>
</html>
