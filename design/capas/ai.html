<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter+Tight:wght@400;500&display=block" rel="stylesheet" />
<style>
  html { zoom: 2; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1600px; height: 900px; overflow: hidden; font-family: "Inter Tight", Arial, sans-serif; }
  .bg { position: absolute; inset: 0; background: radial-gradient(1000px 700px at 75% 50%, #8a5cff 0%, #6d3cf5 45%, #3d1a9e 100%); }
  .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.12); }
  .noise { position: absolute; inset: 0; opacity: .1; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .copy { position: absolute; left: 100px; top: 200px; width: 720px; color: #fff; }
  .eyebrow { font: 700 18px "Space Grotesk"; letter-spacing: .32em; color: #ddd3ff; }
  h1 { margin-top: 24px; font: 700 84px/0.96 "Space Grotesk"; letter-spacing: -0.045em; }
  .sub { margin-top: 26px; font-size: 25px; line-height: 1.35; color: #f0ebff; max-width: 520px; }
  .chips { margin-top: 34px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chips span { padding: 12px 18px; border-radius: 999px; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); font-size: 18px; }
  .phone { position: absolute; padding: 9px; border-radius: 44px; background: #0b0b10; box-shadow: 0 50px 90px -30px rgba(20,5,70,.8); }
  .phone img { display: block; width: 250px; height: 548px; object-fit: cover; object-position: top; border-radius: 36px; background: #fff; }
  .a { left: 860px; top: 200px; transform: rotate(-7deg) scale(.9); }
  .b { left: 1080px; top: 120px; z-index: 2; }
  .c { left: 1310px; top: 210px; transform: rotate(7deg) scale(.9); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="ring" style="left:980px;top:120px;width:640px;height:640px"></div>
  <div class="ring" style="left:1080px;top:220px;width:440px;height:440px"></div>
  <div class="noise"></div>
  <div class="copy">
    <div class="eyebrow">ANGEL INVESTOR CLUB</div>
    <h1>Comunidade<br />de investidores</h1>
    <p class="sub">App mobile para investidores-anjo conversarem, acompanhar novidades e entrar sem atrito.</p>
    <div class="chips"><span>Cadastro pelo telefone</span><span>Feed</span><span>Chat</span></div>
  </div>
  <div class="phone a"><img src="cadastro.webp" alt="" /></div>
  <div class="phone b"><img src="abertura.webp" alt="" /></div>
  <div class="phone c"><img src="feed.webp" alt="" /></div>
</body>
</html>
