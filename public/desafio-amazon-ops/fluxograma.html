<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fluxograma · Desafio Foundey</title>
<style>
  :root { --bg:#f4f4f2; --ink:#16181d; --muted:#6b7280; --line:#8a8f98; --brief:#e6e8ec; --dec:#fff3bf; --note:#dff3e4; --sel:#2563eb; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 14px; background:#fff; border-bottom:1px solid #d9dbe0; }
  header h1 { font-size:15px; margin:0 8px 0 0; }
  button { font:inherit; padding:6px 10px; border:1px solid #c5c8cf; background:#fff; border-radius:8px; cursor:pointer; }
  button:hover { background:#f0f1f4; }
  button.on { background:var(--sel); color:#fff; border-color:var(--sel); }
  .sp { flex:1; }
  #hint { color:var(--muted); font-size:12px; }
  #board { position:relative; width:2400px; height:1600px; background-image:radial-gradient(#d4d6db 1px, transparent 1px); background-size:24px 24px; }
  #wrap { overflow:auto; height:calc(100vh - 56px); }
  svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  svg line.hit { stroke:transparent; stroke-width:14; pointer-events:stroke; cursor:pointer; }
  svg line.vis { stroke:var(--line); stroke-width:2; marker-end:url(#arrow); }
  .node { position:absolute; width:230px; border-radius:10px; border:1.5px solid #b9bcc4; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .node.brief { background:var(--brief); }
  .node.decision { background:var(--dec); border-color:#e0c34a; }
  .node.note { background:var(--note); border-color:#8fcf9f; }
  .node.sel { outline:3px solid var(--sel); }
  .node.from { outline:3px dashed var(--sel); }
  .bar { display:flex; justify-content:space-between; gap:6px; padding:4px 8px; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); cursor:grab; user-select:none; border-bottom:1px solid rgba(0,0,0,.08); }
  .bar:active { cursor:grabbing; }
  .bar select { font-size:11px; border:0; background:transparent; color:inherit; cursor:pointer; }
  .txt { padding:8px 10px 10px; min-height:44px; outline:none; white-space:pre-wrap; }
  .txt:empty::before { content:"escreva aqui..."; color:#9aa0aa; }
  body.mode-link .bar, body.mode-del .bar { cursor:pointer; }
  body.mode-del .node:hover { outline:3px solid #dc2626; }
  dialog { border:1px solid #c5c8cf; border-radius:12px; width:min(720px, 92vw); padding:16px; }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog textarea { width:100%; height:300px; font:12px/1.4 ui-monospace, Consolas, monospace; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
</style>
</head>
<body>
<header>
  <h1>Fluxograma · Desafio Foundey</h1>
  <button id="add">+ Caixa</button>
  <button id="link">Ligar</button>
  <button id="del">Apagar</button>
  <button id="reset">Voltar ao início</button>
  <span class="sp"></span>
  <span id="hint">Arraste pela barra de cima. Clique no texto para editar.</span>
  <button id="copy">Copiar como texto</button>
  <button id="export">Copiar JSON</button>
  <button id="import">Colar JSON</button>
</header>

<div id="wrap"><div id="board">
  <svg><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs><g id="edges"></g></svg>
</div></div>

<dialog id="dlg">
  <p id="dlgTitle" style="margin:0 0 8px"></p>
  <textarea id="dlgText" spellcheck="false"></textarea>
  <div class="row"><button id="dlgOk">OK</button><button id="dlgCancel">Fechar</button></div>
</dialog>

<script>
const KEY = "foundey-fluxo-v1";
const TYPES = { brief:"Do briefing", decision:"Minha decisão", note:"Anotação" };

// Estado inicial: só o que está no PDF (fatos) e perguntas em aberto. Nenhuma resposta de design.
const START = {
  nodes: [
    { id:"n1", x:900, y:40,  type:"brief",    text:"PROBLEMA (briefing)\nAplicação interna de operações da Amazon (fulfillment). O dashboard mostra: atividade recente, tarefas (pedidos), notificações e atualizações do time." },
    { id:"n2", x:480, y:260, type:"brief",    text:"QUEIXA DO USUÁRIO\n\"Eu nunca sei o que precisa da minha atenção primeiro.\" Sente-se sobrecarregado e perde ações importantes." },
    { id:"n3", x:1320,y:260, type:"brief",    text:"QUEIXA DO GESTOR\n\"Não consigo ver o que cada trabalhador está fazendo.\"" },
    { id:"n4", x:900, y:480, type:"brief",    text:"OBJETIVO (briefing)\nIdentificar rápido a prioridade do trabalho individual, do mais crítico ao menos urgente." },
    { id:"n5", x:480, y:700, type:"decision", text:"PERGUNTA\nO que torna uma tarefa \"crítica\"? Quais sinais existem nos dados do dashboard?\n\n→ Minha resposta:" },
    { id:"n6", x:900, y:700, type:"decision", text:"PERGUNTA\nQuais suposições estou fazendo sobre o usuário, o gestor e o contexto de trabalho?\n\n→ Minhas suposições:" },
    { id:"n7", x:1320,y:700, type:"decision", text:"PERGUNTA\nSão duas visões ou uma só com camadas? Por quê?\n\n→ Minha decisão:" },
    { id:"n8", x:480, y:940, type:"decision", text:"VISÃO DO FUNCIONÁRIO\nO que ele precisa ver primeiro? O que fica em segundo plano?\n\n→" },
    { id:"n9", x:1320,y:940, type:"decision", text:"VISÃO DO GESTOR\nO que ele precisa ver para acompanhar a equipe?\n\n→" },
    { id:"n10",x:900, y:1180,type:"brief",    text:"ENTREGAS (briefing)\n1) Raciocínio em meia página ou menos: problema, suposições, o que priorizei e por quê.\n2) Wireframes / telas lo-fi / frames no Figma, com anotações." },
    { id:"n11",x:1320,y:1180,type:"note",     text:"REGRAS DO DESAFIO\nIA só para pesquisa, feedback e implementação de UI. As decisões e a defesa na entrevista são minhas. Prazo: 48 h." }
  ],
  edges: [["n1","n2"],["n1","n3"],["n2","n4"],["n3","n4"],["n4","n5"],["n4","n6"],["n4","n7"],["n5","n8"],["n6","n8"],["n7","n8"],["n7","n9"],["n6","n9"],["n8","n10"],["n9","n10"]]
};

let S = load();
let mode = null, from = null, sel = null;
const board = document.getElementById("board"), edgesG = document.getElementById("edges");

function load(){ try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.nodes) return v; } catch(e){} return clone(START); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
const uid = () => "n" + Math.random().toString(36).slice(2, 8);
const byId = id => S.nodes.find(n => n.id === id);

function render(){
  board.querySelectorAll(".node").forEach(n => n.remove());
  S.nodes.forEach(n => {
    const el = document.createElement("div");
    el.className = "node " + n.type + (sel === n.id ? " sel" : "") + (from === n.id ? " from" : "");
    el.dataset.id = n.id; el.style.left = n.x + "px"; el.style.top = n.y + "px";
    const bar = document.createElement("div"); bar.className = "bar";
    const sw = document.createElement("select");
    Object.entries(TYPES).forEach(([k,v]) => { const o = document.createElement("option"); o.value = k; o.textContent = v; if (k === n.type) o.selected = true; sw.appendChild(o); });
    sw.onchange = () => { n.type = sw.value; save(); render(); };
    sw.onpointerdown = e => e.stopPropagation();
    const grip = document.createElement("span"); grip.textContent = "⠿ mover";
    bar.append(sw, grip);
    const txt = document.createElement("div"); txt.className = "txt"; txt.contentEditable = "true"; txt.textContent = n.text;
    txt.oninput = () => { n.text = txt.innerText; save(); };
    el.append(bar, txt); board.appendChild(el);
    bar.addEventListener("pointerdown", e => onBar(e, n, el));
    el.addEventListener("click", e => { if (mode === "del" && !e.target.closest("select")) { removeNode(n.id); } });
  });
  drawEdges();
}

function center(n){ const el = board.querySelector(`[data-id="${n.id}"]`); const w = el ? el.offsetWidth : 230, h = el ? el.offsetHeight : 90; return { x:n.x + w/2, y:n.y + h/2, w, h }; }
function edgePoint(a, b){ // ponto na borda do retângulo de a em direção a b
  const dx = b.x - a.x, dy = b.y - a.y; if (!dx && !dy) return a;
  const k = Math.min((a.w/2) / Math.abs(dx || 1e-9), (a.h/2) / Math.abs(dy || 1e-9));
  return { x:a.x + dx * k, y:a.y + dy * k };
}
function drawEdges(){
  edgesG.innerHTML = "";
  S.edges.forEach(([f,t], i) => {
    const a = byId(f), b = byId(t); if (!a || !b) return;
    const ca = center(a), cb = center(b), p1 = edgePoint(ca, cb), p2 = edgePoint(cb, ca);
    const mk = c => { const l = document.createElementNS("http://www.w3.org/2000/svg", "line"); l.setAttribute("class", c); l.setAttribute("x1", p1.x); l.setAttribute("y1", p1.y); l.setAttribute("x2", p2.x); l.setAttribute("y2", p2.y); return l; };
    const vis = mk("vis"), hit = mk("hit");
    hit.onclick = () => { if (mode === "del") { S.edges.splice(i, 1); save(); drawEdges(); } };
    edgesG.append(vis, hit);
  });
}

function onBar(e, n, el){
  if (mode === "link") { e.preventDefault(); linkClick(n.id); return; }
  if (mode === "del") return;
  e.preventDefault(); sel = n.id;
  document.querySelectorAll(".node.sel").forEach(x => x.classList.remove("sel")); el.classList.add("sel");
  const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
  const mv = ev => { n.x = Math.max(0, ox + ev.clientX - sx); n.y = Math.max(0, oy + ev.clientY - sy); el.style.left = n.x + "px"; el.style.top = n.y + "px"; drawEdges(); };
  const up = () => { removeEventListener("pointermove", mv); removeEventListener("pointerup", up); save(); };
  addEventListener("pointermove", mv); addEventListener("pointerup", up);
}

function linkClick(id){
  if (!from) { from = id; render(); return; }
  if (from !== id && !S.edges.some(([a,b]) => a === from && b === id)) S.edges.push([from, id]);
  from = null; save(); render();
}
function removeNode(id){ S.nodes = S.nodes.filter(n => n.id !== id); S.edges = S.edges.filter(([a,b]) => a !== id && b !== id); save(); render(); }

function setMode(m){
  mode = mode === m ? null : m; from = null;
  document.body.classList.toggle("mode-link", mode === "link");
  document.body.classList.toggle("mode-del", mode === "del");
  document.getElementById("link").classList.toggle("on", mode === "link");
  document.getElementById("del").classList.toggle("on", mode === "del");
  document.getElementById("hint").textContent = mode === "link" ? "Clique na barra da caixa de origem e depois na de destino." : mode === "del" ? "Clique numa caixa ou numa seta para apagar." : "Arraste pela barra de cima. Clique no texto para editar.";
  render();
}

document.getElementById("add").onclick = () => {
  const w = document.getElementById("wrap"); const id = uid();
  S.nodes.push({ id, x:w.scrollLeft + 80 + (S.nodes.length % 5) * 20, y:w.scrollTop + 80 + (S.nodes.length % 5) * 20, type:"decision", text:"" });
  save(); render(); board.querySelector(`[data-id="${id}"] .txt`).focus();
};
document.getElementById("link").onclick = () => setMode("link");
document.getElementById("del").onclick = () => setMode("del");
document.getElementById("reset").onclick = () => { if (confirm("Voltar ao fluxograma inicial? Isso apaga as suas edições.")) { S = clone(START); save(); render(); } };

function asText(){
  const label = n => `[${TYPES[n.type]}] ${n.text.replace(/\n+/g, " | ").trim()}`;
  const nodes = S.nodes.slice().sort((a,b) => a.y - b.y || a.x - b.x);
  const num = Object.fromEntries(nodes.map((n,i) => [n.id, i + 1]));
  return "CAIXAS\n" + nodes.map(n => `${num[n.id]}. ${label(n)}`).join("\n") + "\n\nLIGAÇÕES\n" + S.edges.map(([a,b]) => `${num[a]} -> ${num[b]}`).join("\n");
}
async function copy(text, title){
  try { await navigator.clipboard.writeText(text); document.getElementById("hint").textContent = "Copiado. Cole no chat."; return; } catch(e){}
  const dlg = document.getElementById("dlg"); document.getElementById("dlgTitle").textContent = title + " (selecione tudo e copie):";
  const ta = document.getElementById("dlgText"); ta.value = text; dlg.dataset.mode = "show"; dlg.showModal(); ta.select();
}
document.getElementById("copy").onclick = () => copy(asText(), "Texto do fluxograma");
document.getElementById("export").onclick = () => copy(JSON.stringify(S), "JSON do fluxograma");
document.getElementById("import").onclick = () => {
  const dlg = document.getElementById("dlg"); document.getElementById("dlgTitle").textContent = "Cole o JSON do fluxograma:";
  document.getElementById("dlgText").value = ""; dlg.dataset.mode = "import"; dlg.showModal();
};
document.getElementById("dlgOk").onclick = () => {
  const dlg = document.getElementById("dlg");
  if (dlg.dataset.mode === "import") {
    try { const v = JSON.parse(document.getElementById("dlgText").value); if (!v.nodes || !v.edges) throw 0; S = v; save(); render(); }
    catch(e){ alert("JSON inválido."); return; }
  }
  dlg.close();
};
document.getElementById("dlgCancel").onclick = () => document.getElementById("dlg").close();
addEventListener("keydown", e => { if (e.key === "Escape" && mode) setMode(mode); });

render();
</script>
</body>
</html>
