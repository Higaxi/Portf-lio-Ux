<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hora do Lar · App do funcionário (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout das telas finais do case (Ponto, Resumo do mês e Menu); branding do site
     público horadolar.com.br: logo oficial, Roboto, laranja #FD6D04, grafite #323232,
     pêssego #FDCCA4, verde #08A54D e roxo #6900AE. Dados fictícios. */
  :root{
    --laranja:#fd6d04; --laranja-esc:#d95a00; --pessego:#fdcca4; --creme:#fff4ec;
    --tinta:#323232; --texto:#5c5c5c; --suave:#9a9a9a; --linha:#ececec; --cinza:#f1f1f1;
    --verde:#08a54d; --verde-claro:#e7f6ee; --vermelho:#d8262f; --vermelho-claro:#fdecec; --roxo:#6900ae; --branco:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Roboto",system-ui,sans-serif;background:#141414;color:var(--tinta);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px}
  button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;text-align:inherit}
  input,textarea{font:inherit;color:inherit}

  .topo{color:#ddd;text-align:center;margin-bottom:18px;max-width:640px}
  .topo h1{font-size:18px;font-weight:700}
  .topo .selo-fic{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--pessego);border:1px solid rgba(253,204,164,.4);border-radius:999px;padding:3px 10px}
  .topo p{font-size:13px;color:#999;margin-top:6px}
  .topo a{color:var(--pessego);font-weight:600}
  .celular{width:390px;height:844px;border-radius:50px;background:#0b0b0b;padding:11px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8),inset 0 0 0 2px #2a2a2a}
  .visor{width:100%;height:100%;border-radius:40px;overflow:clip;position:relative;background:#fff}

  /* ---------- tela ---------- */
  .tela{position:absolute;inset:0;display:flex;flex-direction:column;overflow:clip;background:#fdfdfd;opacity:0;pointer-events:none;transform:translateX(20px);transition:opacity .3s ease,transform .3s ease}
  .tela.ativa{opacity:1;pointer-events:auto;transform:none}
  .status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600}
  .status i{font-style:normal;letter-spacing:1px}
  .conteudo{flex:1;overflow-y:auto;padding-bottom:18px}
  .conteudo::-webkit-scrollbar{width:0}

  /* logo oficial */
  .logo{display:block;height:30px;margin:2px auto 0;width:max-content}
  .logo img{height:100%;display:block}
  .logo.grande{height:40px}

  /* saudação + abas (layout do case) */
  .saud{padding:18px 22px 0}
  .saud h1{font-size:23px;font-weight:600}
  .saud p{font-size:13px;color:var(--suave);margin-top:6px}
  .abas{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0}
  .aba{height:46px;padding:0 14px;border-radius:8px;color:var(--laranja);font-size:14px;display:flex;align-items:center;gap:8px;transition:background .15s}
  .aba svg{width:19px;height:19px}
  .aba.on{background:var(--laranja);color:#fff;font-weight:600;box-shadow:0 6px 14px -8px rgba(253,109,4,.8)}

  /* marcações */
  .marcas{padding:26px 44px 0;display:flex;flex-direction:column;gap:12px}
  .marca{height:46px;border-radius:10px;background:#f3f3f3;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:14px;color:var(--suave)}
  .marca svg{width:19px;height:19px;flex:none}
  .marca span{flex:1}
  .marca b{font-weight:400;color:#b8b8b8;font-variant-numeric:tabular-nums}
  .marca.feita{color:var(--tinta);font-weight:500}
  .marca.feita svg{color:var(--laranja)}
  .marca.feita b{color:var(--laranja);font-weight:600}
  .btn-reg{height:42px;border-radius:21px;background:var(--laranja);color:#fff;font-weight:600;font-size:14px;width:100%;display:flex;align-items:center;justify-content:center;transition:transform .12s, background .15s}
  .btn-reg:hover{background:var(--laranja-esc)}
  .btn-reg:active{transform:scale(.97)}
  .jornada{margin:18px 22px 0;border-radius:12px;background:var(--verde-claro);color:#0c6b35;padding:14px 16px;font-size:13px;display:flex;gap:12px;align-items:flex-start}
  .jornada svg{width:22px;height:22px;flex:none}
  .jornada b{display:block;font-size:15px;margin-bottom:2px}

  /* resumo do mês */
  .cartao-horas{margin:20px 22px 0;padding:18px 18px;border-radius:10px;background:var(--cinza);display:flex;align-items:center;gap:18px}
  .anel{width:56px;height:56px;flex:none;transform:rotate(-90deg)}
  .anel circle{fill:none;stroke-width:4}
  .anel .fundo{stroke:#dedede}
  .anel .valor{stroke:var(--laranja);stroke-linecap:round;transition:stroke-dasharray .5s ease}
  .cartao-horas b{display:block;font-size:16px;font-weight:600}
  .cartao-horas span{font-size:15px;color:var(--texto);font-variant-numeric:tabular-nums}
  .resumo-cab{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 12px;border-bottom:1px solid var(--linha)}
  .resumo-cab h2{font-size:16px;font-weight:500}
  .resumo-cab small{display:block;font-size:12px;color:var(--suave);margin-top:2px}
  .btn-mes{height:36px;border-radius:7px;background:var(--laranja);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;padding:0 13px}
  .btn-mes svg{width:16px;height:16px}
  .resumo-lista{padding:16px 22px;font-size:14px;display:flex;flex-direction:column;gap:12px}
  .ri{display:flex;align-items:center;gap:12px;padding-left:10px;width:100%;text-align:left}
  .ri .bola{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
  .ri .bola svg{width:12px;height:12px}
  .ri em{font-style:normal;flex:1}
  .ri .seta{width:16px;height:16px;color:var(--suave)}
  .rl b{font-weight:600}
  .rl span{font-variant-numeric:tabular-nums}

  /* espelho */
  .espelho{margin:6px 16px 0;border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:#fff}
  .espelho table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
  .espelho th{font-size:11px;color:var(--suave);font-weight:600;text-align:left;padding:10px 10px;background:#fafafa;border-bottom:1px solid var(--linha)}
  .espelho td{padding:9px 10px;border-bottom:1px solid var(--linha)}
  .espelho tr:last-child td{border-bottom:0}
  .espelho td:first-child{font-weight:500}
  .espelho td small{color:var(--suave);font-weight:400;margin-left:3px}
  .espelho .mais{color:var(--verde);font-weight:600}
  .espelho .menos{color:var(--vermelho);font-weight:600}
  .espelho .falta td{color:var(--vermelho)}
  .espelho .hoje td{background:var(--creme)}
  .totais{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 16px 4px}
  .totais div{background:var(--cinza);border-radius:10px;padding:9px 8px;text-align:center}
  .totais small{display:block;font-size:10.5px;color:var(--suave)}
  .totais b{font-size:15px;font-variant-numeric:tabular-nums}

  /* cabeçalho com voltar */
  .barra{display:flex;align-items:center;gap:8px;padding:2px 14px 10px;flex:none}
  .barra button{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
  .barra button svg{width:22px;height:22px}
  .barra h2{font-size:18px;font-weight:600}
  .titulo-sec{font-size:20px;font-weight:600;padding:18px 22px 4px}
  .sub{font-size:13px;color:var(--suave);padding:0 22px}
  .rotulo{font-size:11px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.6px;padding:18px 22px 8px}

  /* menu (layout do case) */
  .lista-menu{display:flex;flex-direction:column;gap:14px;padding:34px 24px 0}
  .item-menu{height:56px;border-radius:8px;background:var(--cinza);display:flex;align-items:center;gap:16px;padding:0 18px;font-size:15px;width:100%;transition:background .15s}
  .item-menu:hover{background:#e9e9e9}
  .item-menu svg{width:20px;height:20px;flex:none}
  .item-menu span{flex:1}
  .item-menu .seta{width:18px;height:18px}

  /* cartões e listas */
  .cartoes{display:flex;flex-direction:column;gap:10px;padding:0 16px}
  .cartao{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:14px;width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start}
  .cartao .ic{width:38px;height:38px;border-radius:10px;background:var(--creme);color:var(--laranja);display:grid;place-items:center;flex:none}
  .cartao .ic svg{width:20px;height:20px}
  .cartao .txt{flex:1;min-width:0}
  .cartao b{display:block;font-size:14px;font-weight:600}
  .cartao p{font-size:13px;color:var(--texto);margin-top:3px;line-height:1.4}
  .cartao small{font-size:11.5px;color:var(--suave);display:block;margin-top:6px}
  .cartao.nao-lida{border-color:var(--pessego);background:#fffaf6}
  .ponto-novo{width:8px;height:8px;border-radius:50%;background:var(--laranja);flex:none;margin-top:6px}
  .st{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;margin-top:8px}
  .st-ag{background:var(--creme);color:var(--laranja-esc)}
  .st-ok{background:var(--verde-claro);color:#0c6b35}
  .st-rec{background:var(--vermelho-claro);color:var(--vermelho)}
  .compara{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;font-size:12px}
  .compara span{background:#f6f6f6;border-radius:8px;padding:7px 9px;color:var(--suave)}
  .compara span:last-child{background:var(--creme)}
  .compara b{font-size:13px;color:var(--tinta);margin-top:1px}
  .compara span:last-child b{color:var(--laranja-esc)}
  .doc-linha{display:flex;align-items:center;gap:12px;background:var(--cinza);border-radius:8px;height:54px;padding:0 14px;width:100%;font-size:14px;text-align:left}
  .doc-linha svg{width:19px;height:19px;flex:none}
  .doc-linha span{flex:1}
  .doc-linha small{font-size:12px;color:var(--suave)}
  .doc-linha.off{opacity:.55;cursor:default}
  .doc-linha .seta{width:16px;height:16px}
  .vazio{text-align:center;color:var(--texto);font-size:14px;padding:46px 28px 10px;line-height:1.5}
  .vazio .ic-g{width:72px;height:72px;border-radius:50%;background:var(--creme);color:var(--laranja);display:grid;place-items:center;margin:0 auto 16px}
  .vazio .ic-g svg{width:34px;height:34px}
  .vazio b{display:block;color:var(--tinta);font-size:17px;margin-bottom:6px}

  /* botões */
  .btn{height:46px;border-radius:999px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .12s, background .15s}
  .btn:active{transform:scale(.97)}
  .btn svg{width:18px;height:18px}
  .btn-laranja{background:var(--laranja);color:#fff}
  .btn-laranja:hover{background:var(--laranja-esc)}
  .btn-contorno{border:1.5px solid #d4d4d4;color:var(--tinta);background:#fff}
  .btn-zap{background:#25d366;color:#fff}
  .duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pad{padding:0 22px}

  /* formulário */
  .campo{display:block;margin-top:16px}
  .campo>span{display:block;font-size:12px;font-weight:600;color:var(--texto);margin-bottom:6px}
  .campo input,.campo textarea{width:100%;height:48px;border:1.5px solid #e3e3e3;border-radius:10px;padding:0 14px;background:#fff;font-size:15px;outline:none;transition:border-color .15s}
  .campo textarea{height:84px;padding:12px 14px;resize:none;line-height:1.4}
  .campo input:focus,.campo textarea:focus{border-color:var(--laranja)}
  .opcoes{display:flex;gap:8px;flex-wrap:wrap}
  .op{border:1.5px solid #e3e3e3;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:500;background:#fff}
  .op.on{border-color:var(--laranja);color:var(--laranja-esc);background:var(--creme);font-weight:600}
  .erro{font-size:12px;color:var(--vermelho);margin-top:8px;min-height:16px}
  .aviso{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;background:var(--creme);color:#8a3c00;border-radius:12px;padding:11px 13px;margin-top:16px;line-height:1.4}
  .aviso svg{width:17px;height:17px;flex:none;margin-top:1px}

  /* splash e login */
  .splash{background:linear-gradient(160deg,var(--laranja) 0%,#f0571a 55%,var(--roxo) 130%);align-items:center;justify-content:center;color:#fff}
  .splash .logo{height:46px}
  .splash small{position:absolute;bottom:64px;font-size:13px;opacity:.85}
  .carrega{position:absolute;bottom:110px;width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:gira 1s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .login-topo{padding:30px 26px 0;text-align:center}
  .login-topo h2{font-size:24px;font-weight:600;margin-top:34px}
  .login-topo p{font-size:14px;color:var(--suave);margin-top:6px}
  .link{color:var(--laranja);font-weight:600;font-size:13px}
  .rodape-login{margin-top:auto;padding:0 26px 34px;text-align:center;font-size:13px;color:var(--texto)}

  /* configuração */
  .perfil{display:flex;align-items:center;gap:14px;margin:8px 16px 0;padding:16px;border-radius:12px;background:var(--cinza)}
  .avatar{width:52px;height:52px;border-radius:50%;background:var(--pessego);color:#8a3c00;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
  .perfil b{display:block;font-size:16px}
  .perfil small{font-size:13px;color:var(--texto)}
  .opcao{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-bottom:1px solid var(--linha);font-size:14px;width:100%;text-align:left}
  .opcao>svg{width:18px;height:18px;flex:none;color:var(--suave)}
  .opcao small{display:block;font-size:12px;color:var(--suave);margin-top:2px}
  .chave{width:46px;height:28px;border-radius:14px;background:#d7d7d7;position:relative;flex:none;transition:background .2s}
  .chave::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
  .chave.on{background:var(--laranja)}
  .chave.on::after{transform:translateX(18px)}

  /* documento */
  .papel{margin:6px 16px 0;background:#fff;border-radius:8px;box-shadow:0 12px 30px -14px rgba(0,0,0,.4);padding:18px;font-size:12px;border:1px solid var(--linha)}
  .papel-cab{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--laranja);padding-bottom:10px;gap:10px}
  .papel-cab .logo{height:22px;margin:0}
  .papel-cab div{text-align:right;line-height:1.35}
  .papel-cab b{font-size:13px}
  .papel h4{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--suave);margin:12px 0 4px}
  .papel table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .papel td{padding:6px 0;border-bottom:1px solid var(--linha)}
  .papel td:last-child{text-align:right;white-space:nowrap}
  .papel .tot td{font-weight:700;font-size:13.5px;border-bottom:0;padding-top:9px}
  .papel .neg{color:var(--vermelho)}
  .papel .nota{font-size:10.5px;color:var(--suave);margin-top:12px}

  /* barra inferior (layout do case) */
  .nav{flex:none;height:76px;background:#fdf3ee;border-top:1px solid #f6e3d8;display:flex;align-items:flex-start;justify-content:space-around;padding:10px 6px 0}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#555;width:84px;position:relative}
  .nav button svg{width:23px;height:23px}
  .nav button.on{color:var(--laranja);font-weight:500}
  .badge{position:absolute;top:-4px;left:calc(50% + 4px);min-width:17px;height:17px;border-radius:9px;background:var(--laranja);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fdf3ee}

  /* folha inferior (confirmação) e aviso */
  .veu{position:absolute;inset:0;background:rgba(20,20,20,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;display:flex;align-items:flex-end}
  .veu.aberto{opacity:1;pointer-events:auto}
  .folha{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:12px 22px 34px;transform:translateY(100%);transition:transform .3s ease}
  .veu.aberto .folha{transform:none}
  .folha .pegador{width:40px;height:4px;border-radius:2px;background:#ddd;margin:0 auto 16px}
  .folha h3{font-size:18px;font-weight:600}
  .folha p{font-size:13px;color:var(--texto);margin-top:4px;line-height:1.4}
  .hora-grande{font-size:56px;font-weight:600;color:var(--laranja);text-align:center;margin:18px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .folha .centro{text-align:center}
  .meses{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .mes{height:50px;border-radius:10px;border:1.5px solid #e6e6e6;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-size:15px;width:100%}
  .mes.on{border-color:var(--laranja);background:var(--creme);font-weight:600;color:var(--laranja-esc)}
  .toast{position:absolute;left:16px;right:16px;bottom:94px;background:var(--tinta);color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;pointer-events:none;z-index:30}
  .toast.mostra{opacity:1;transform:none}
  .toast svg{width:18px;height:18px;color:#7be0a5;flex:none}

  /* ---------- modo embutido (iframe do portfólio) ---------- */
  body.modo-embed{background:transparent;padding:0;min-height:0;display:block}
  body.modo-embed .topo{display:none}
  body.modo-embed .celular{box-shadow:none}

  /* ---------- modo telas ---------- */
  body.modo-telas{display:block;padding:40px}
  body.modo-telas .topo{text-align:left;max-width:none}
  body.modo-telas .celular{display:none}
  .quadro{display:none}
  body.modo-telas .quadro{display:flex;flex-wrap:wrap;gap:48px}
  .quadro figure{width:390px}
  .quadro figcaption{color:#ccc;font-size:14px;font-weight:700;margin-bottom:12px}
  .quadro .moldura{width:390px;height:844px;position:relative;overflow:clip;border-radius:30px;background:#fff}
  .quadro .tela{opacity:1;transform:none;pointer-events:none}
</style>
</head>
<body>

<header class="topo">
  <h1>Hora do Lar · App do funcionário</h1>
  <span class="selo-fic">Recriação ilustrativa · dados fictícios</span>
  <p>Telas do case com a identidade do site público do Hora do Lar. Nomes, horários e valores são inventados.
    <span id="link-modo"></span></p>
</header>

<div class="celular"><div class="visor" id="visor"></div></div>
<div class="quadro" id="quadro"></div>

<template id="telas">

<!-- 01 Splash -->
<section class="tela splash" data-id="splash" data-nome="01 · Abertura">
  <span class="logo"><img src="img/logo-branco.webp" alt="hora do lar"></span>
  <div class="carrega"></div>
  <small>App do funcionário</small>
  <button style="position:absolute;inset:0" data-go="login" aria-label="Continuar"></button>
</section>

<!-- 02 Login -->
<section class="tela" data-id="login" data-nome="02 · Entrar">
  <div class="status"><span class="js-hora">8:00</span><i>●●● ▮</i></div>
  <div class="login-topo">
    <span class="logo grande"><img src="img/logo.png" alt="hora do lar"></span>
    <h2>Oi! Vamos bater o ponto?</h2>
    <p>Entre com os dados que o seu empregador cadastrou.</p>
  </div>
  <div class="pad">
    <label class="campo"><span>E-mail ou celular</span><input value="rosa.almeida@exemplo.com" autocomplete="off"></label>

    ],

let estado = estadoInicial();

/* espelho calculado a partir das marcações: tudo bate com o resumo */
function espelho(chave){
  const M = MESES[chave], linhas = [];
  const fim = new Date(M.ano, M.m+1, 0).getDate();
  for (let d=1; d<=fim; d++){
    const dt = new Date(M.ano, M.m, d), ds = dt.getDay();
    if (ds===0 || ds===6 || M.feriados.includes(d)) continue;
    if (M.hoje && d>M.hoje) break;
    const v = M.var[d] || {};
    const base = {d, ds, rot:`${String(d).padStart(2,'0')}/${String(M.m+1).padStart(2,'0')}`};
    if (M.hoje === d){
      const [e,i,r,s] = estado.marc;
      let tot = 0; if (e&&i) tot += min(i)-min(e); if (r&&s) tot += min(s)-min(r);
      linhas.push({...base, hoje:true, e, s, tot, conta:!!s, atraso:0, extra:0});
      continue;
    }
    if (v.falta){ linhas.push({...base, falta:true, tot:0, conta:true, atraso:0, extra:0}); continue; }
    const e = v.e||'08:00', s = v.s||'17:00';
    const tot = min(s)-min(e)-60;
    linhas.push({...base, e, s, tot, conta:true, atraso:Math.max(0,min(e)-480), extra:Math.max(0,tot-480)});
  }
  return linhas;
}
function resumoMes(chave){
  const L = espelho(chave);
  const meta = L.length*8*60;
  let trab=0, extra=0, atraso=0, faltas=0;
  L.forEach(l=>{ trab += Math.min(l.tot,480); extra += l.extra; atraso += l.atraso; if (l.falta) faltas++; });
  return {meta, trab, extra, atraso, faltas, L};
}
const reais = v => 'R$ ' + v.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
function inss(b){ // tabela progressiva 2024 (ilustrativa)
  const f = [[1412,.075],[2666.68,.09],[4000.03,.12]]; let ant=0, t=0;
  for (const [teto,a] of f){ if (b>ant){ t += (Math.min(b,teto)-ant)*a; } ant = teto; }
  return Math.round(t*100)/100;
}

  const {tipo, mes} = estado.doc;
  const cab = (t, sub) => `<div class="papel-cab"><span class="logo"><img src="img/logo.png" alt="hora do lar"></span><div><b>${t}</b><br>${sub}</div></div>
    <h4>Empregador</h4><p>Família Souza (fictícia)</p><h4>Empregada</h4><p>Rosa Almeida · Empregada doméstica</p>`;
  const salario = 1800;
  if (tipo==='folha'){
    const R = resumoMes(mes);
    const linhas = R.L.map(l=>`<tr><td>${l.rot} ${DIAS[l.ds]}</td><td>${l.falta?'Falta':`${l.e} – ${l.s}`}</td><td>${hhmm(l.tot)}</td></tr>`).join('');
    return `<div class="papel">${cab('Folha de ponto', MESES[mes].nome)}<h4>Marcações</h4><table>${linhas}
      <tr class="tot"><td colspan="2">Horas trabalhadas</td><td>${hhmm(R.trab)}</td></tr></table>
      <p class="nota">Horas extras: ${hhmm(R.extra)} · Atrasos: ${hhmm(R.atraso)} · Faltas: ${R.faltas}</p></div>`;
  }
  let itens, titulo, sub;
  if (tipo==='recibo'){
    const R = resumoMes(mes);
    const extra = Math.round(salario/220*1.5*(R.extra/60)*100)/100;
    const falta = R.faltas*salario/30, atr = Math.round(salario/220*(R.atraso/60)*100)/100;
    const bruto = salario + extra - falta - atr;
    itens = [['Salário', salario]];
    if (extra) itens.push([`Horas extras 50% (${hhmm(R.extra)})`, extra]);
    if (falta) itens.push([`Faltas (${R.faltas} dia)`, -falta]);
    if (atr) itens.push([`Atrasos (${hhmm(R.atraso)})`, -atr]);
    itens.push(['INSS', -inss(bruto)]);
    titulo = 'Recibo de pagamento'; sub = MESES[mes].nome;
  } else if (tipo==='decimo'){
    itens = [['13º salário (2ª parcela)', salario], ['Adiantamento (1ª parcela)', -900], ['INSS', -inss(salario)]];
    titulo = 'Recibo do 13º salário'; sub = 'Dezembro de 2024';
  } else {
    itens = [['Férias (30 dias)', salario], ['1/3 constitucional', 600], ['INSS', -inss(2400)]];
    titulo = 'Recibo de férias'; sub = 'Outubro de 2024';
  }
  const liq = itens.reduce((s,[,v])=>s+v,0);
  return `<div class="papel">${cab(titulo, sub)}<h4>Valores</h4><table>
    ${itens.map(([k,v])=>`<tr><td>${k}</td><td class="${v<0?'neg':''}">${v<0?'− ':''}${reais(Math.abs(v))}</td></tr>`).join('')}
    <tr class="tot"><td>Líquido a receber</td><td>${reais(liq)}</td></tr></table>
    <p class="nota">Documento ilustrativo · valores fictícios.</p></div>`;
}

function render(raiz){
  raiz.querySelectorAll('.js-hora').forEach(b=>b.textContent=estado.hora);
  const naoLidas = estado.notifs.filter(n=>!n.lida).length;
  raiz.querySelectorAll('.js-badge').forEach(b=>{b.textContent=naoLidas; b.style.display=naoLidas?'grid':'none';});
  raiz.querySelectorAll('.js-marcas').forEach(c=>c.innerHTML=htmlMarcas());
  raiz.querySelectorAll('.js-jornada').forEach(c=>{
    if (!estado.marc[3]) { c.innerHTML=''; return; }
    const [e,i,r,s] = estado.marc, tot = min(i)-min(e)+min(s)-min(r);
    c.innerHTML = `<div class="jornada">${IC.okc}<span><b>Jornada de hoje concluída</b>${hm(tot)} trabalhadas, com ${hm(min(r)-min(i))} de intervalo.</span></div>
      <div class="pad" style="margin-top:12px"><button class="btn btn-contorno" data-go="resumo">${IC.cal} Ver resumo do mês</button></div>`;
  });
  const R = resumoMes(estado.mes), M = MESES[estado.mes];
  raiz.querySelectorAll('.js-mes-nome').forEach(b=>b.textContent=M.nome + (M.hoje?' · até hoje':''));
  raiz.querySelectorAll('.js-horas').forEach(c=>{
    const pct = Math.min(100, R.trab/R.meta*100);
    c.innerHTML = `<div class="cartao-horas"><svg class="anel" viewBox="0 0 36 36"><circle class="fundo" cx="18" cy="18" r="15"/><circle class="valor" cx="18" cy="18" r="15" stroke-dasharray="${(pct*94.25/100).toFixed(1)} 94.25"/></svg>
      <div><b>Horas trabalhadas</b><span>${horasDec(R.trab)}/${horasDec(R.meta)} horas</span></div></div>`;
  });
  raiz.querySelectorAll('.js-resumo').forEach(c=>c.innerHTML = `
    <button class="ri" data-go="espelho"><span class="bola" style="background:var(--verde)">${IC.ok}</span><em>Extrato de horas extras</em>${IC.seta.replace('<svg','<svg class="seta"')}</button>
    <span class="rl"><b>Saldo:</b> <span>${hhmm(R.extra)}:00 horas</span></span>
    <button class="ri" data-go="espelho"><span class="bola" style="background:var(--vermelho)">!</span><em>Resumo de descontos</em>${IC.seta.replace('<svg','<svg class="seta"')}</button>
    <span class="rl"><b>Atrasos:</b> <span>${hhmm(R.atraso)}:00 horas</span></span>
    <span class="rl" style="margin-top:-6px"><b>Faltas:</b> ${R.faltas} ${R.faltas===1?'dia':'dias'}</span>`);
  raiz.querySelectorAll('.js-totais').forEach(c=>c.innerHTML = `<div><small>Trabalhadas</small><b>${hhmm(R.trab)}</b></div><div><small>Extras</small><b style="color:var(--verde)">${hhmm(R.extra)}</b></div><div><small>Atrasos</small><b style="color:var(--vermelho)">${hhmm(R.atraso)}</b></div><div><small>Faltas</small><b>${R.faltas}</b></div>`);
  raiz.querySelectorAll('.js-espelho').forEach(c=>c.innerHTML = `<table><tr><th>Dia</th><th>Entrada</th><th>Saída</th><th>Total</th><th>Saldo</th></tr>
    ${R.L.slice().reverse().map(l=>{
      if (l.falta) return `<tr class="falta"><td>${l.rot}<small>${DIAS[l.ds]}</small></td><td colspan="3">Falta</td><td class="menos">−08:00</td></tr>`;
      const saldo = l.hoje && !l.conta ? '' : (l.extra ? `<span class="mais">+${hhmm(l.extra)}</span>` : l.atraso ? `<span class="menos">−${hhmm(l.atraso)}</span>` : '—');
      return `<tr class="${l.hoje?'hoje':''}"><td>${l.rot}<small>${l.hoje?'hoje':DIAS[l.ds]}</small></td><td>${l.e||'--:--'}</td><td>${l.s||'--:--'}</td><td>${l.e?hhmm(l.tot):'—'}</td><td>${saldo}</td></tr>`;
    }).join('')}</table>`);
  raiz.querySelectorAll('.js-notifs').forEach(c=>c.innerHTML = estado.notifs.map((n,i)=>`<button class="cartao ${n.lida?'':'nao-lida'}" data-notif="${i}">
    <span class="ic">${IC[n.ic]}</span><span class="txt"><b>${n.t}</b><p>${n.d}</p><small>${n.q}</small></span>${n.lida?'':'<span class="ponto-novo"></span>'}</button>`).join(''));
  const ST = {ag:['st-ag','Aguardando empregador'], ok:['st-ok','Aprovado'], rec:['st-rec','Não aprovado']};
  raiz.querySelectorAll('.js-pedidos').forEach(c=>c.innerHTML = estado.pedidos.map(p=>`<div class="cartao"><span class="ic">${IC.relogio}</span><span class="txt">
    <b>${p.marc} · ${p.dia}</b><div class="compara"><span>Registrado<b style="display:block">${p.de}</b></span><span>Pedido<b style="display:block">${p.para}</b></span></div>
    <p>“${p.motivo}”</p>${p.resp?`<p style="color:var(--vermelho)">Resposta: ${p.resp}</p>`:''}
    <span class="st ${ST[p.status][0]}">${ST[p.status][1]}</span><small>Enviado em ${p.quando}</small></span></div>`).join(''));
  raiz.querySelectorAll('.js-docs-mensais').forEach(c=>c.innerHTML=docsMensais());
  raiz.querySelectorAll('.js-docs-periodicos').forEach(c=>c.innerHTML=docsPeriodicos());
  raiz.querySelectorAll('.js-doc').forEach(c=>c.innerHTML=htmlDoc());
  const titulos = {recibo:'Recibo de pagamento', folha:'Folha de ponto', decimo:'13º salário', ferias:'Recibo de férias'};
  raiz.querySelectorAll('.js-doc-titulo').forEach(b=>b.textContent=titulos[estado.doc.tipo]);
  raiz.querySelectorAll('.js-doc-voltar').forEach(b=>b.dataset.go=estado.docVolta);
  raiz.querySelectorAll('.js-chave').forEach(k=>k.classList.toggle('on', !!estado.chaves[k.dataset.k]));
}

if (modoTelas) {
  const quadro = document.getElementById('quadro');
  // estado de exemplo para a prancha: entrada já registrada
  estado.marc[0] = '08:00';
  [...molde.querySelectorAll('.tela')].forEach(t=>{
    const fig = document.createElement('figure');
    fig.innerHTML = `<figcaption>${t.dataset.nome}</figcaption><div class="moldura"></div>`;
    const c = t.cloneNode(true); c.classList.add('ativa');
    fig.querySelector('.moldura').appendChild(c);
    quadro.appendChild(fig);
  });
  preparar(quadro);
} else {
  const visor = document.getElementById('visor');
  visor.appendChild(molde.cloneNode(true));
  visor.insertAdjacentHTML('beforeend', '<div class="veu" id="veu"><div class="folha" id="folha"></div></div><div class="toast" id="toast"></div>');
  preparar(visor);
  const veu = document.getElementById('veu'), folha = document.getElementById('folha'), toast = document.getElementById('toast');
  let tToast;
  const avisar = (txt) => { toast.innerHTML = IC.okc + `<span>${txt}</span>`; toast.classList.add('mostra'); clearTimeout(tToast); tToast = setTimeout(()=>toast.classList.remove('mostra'), 2600); };
  const abrir = html => { folha.innerHTML = '<div class="pegador"></div>' + html; veu.classList.add('aberto'); };
  const fechar = () => veu.classList.remove('aberto');
  const ir = id => {
    fechar();
    visor.querySelectorAll('.tela').forEach(t=>t.classList.toggle('ativa', t.dataset.id===id));
    const c = visor.querySelector('.tela.ativa .conteudo'); if (c) c.scrollTop = 0;
    render(visor);
  };
  ir('splash');
  setTimeout(()=>{ if (visor.querySelector('.tela.ativa').dataset.id==='splash') ir('login'); }, 2200);

  veu.addEventListener('click', e=>{ if (e.target===veu) fechar(); });
  visor.addEventListener('click', e=>{
    const el = e.target.closest('button'); if (!el) return;
    const d = el.dataset, act = d.act;
    if (act==='registrar'){
      const n = estado.marc.findIndex(x=>!x), m = MARCAS[n];
      abrir(`<h3>${m.bot}?</h3><p>Sexta-feira, 31 de janeiro de 2025 · registro pelo app</p>
        <div class="hora-grande">${m.hora}</div><p class="centro" style="font-size:12px;color:var(--suave)">Simulação: o relógio avança até a próxima marcação.</p>
        <div class="duas" style="margin-top:20px"><button class="btn btn-contorno" data-act="fechar">Cancelar</button><button class="btn btn-laranja" data-act="confirmar">Confirmar</button></div>`);
      return;
    }
    if (act==='confirmar'){
      const n = estado.marc.findIndex(x=>!x), m = MARCAS[n];
      estado.marc[n] = m.hora; estado.hora = String(+m.hora.slice(0,2)) + m.hora.slice(2);
      fechar(); render(visor); avisar(`${m.nome} registrada às ${m.hora}.`); return;
    }
    if (act==='fechar'){ fechar(); return; }
    if (act==='mes'){
      abrir(`<h3>Buscar mês</h3><p>Veja as horas de meses anteriores.</p><div class="meses">
        ${Object.entries(MESES).map(([k,M])=>`<button class="mes ${k===estado.mes?'on':''}" data-mes="${k}">${M.nome}${k===estado.mes?IC.ok.replace('<svg','<svg width="18" height="18"'):''}</button>`).join('')}</div>`);
      return;
    }
    if (d.mes){ estado.mes = d.mes; fechar(); render(visor); return; }
    if (d.notif !== undefined){ const n = estado.notifs[+d.notif]; n.lida = true; ir(n.go); return; }
    if (d.doc){ const [tipo, mes] = d.doc.split(':'); estado.doc = {tipo, mes}; estado.docVolta = visor.querySelector('.tela.ativa').dataset.id; ir('doc'); return; }
    if (act==='baixar'){ avisar('PDF salvo nos downloads (simulação).'); return; }
    if (act==='esqueci'){ avisar('Enviamos um link de nova senha para o seu e-mail (simulação).'); return; }
    if (act==='suporte'){ avisar('Aqui abriria a conversa com o suporte no WhatsApp.'); return; }
    if (el.classList.contains('op')){ el.parentElement.querySelectorAll('.op').forEach(o=>o.classList.remove('on')); el.classList.add('on'); return; }
    if (act==='enviar-ajuste'){
      const tela = visor.querySelector('.tela.ativa');
      const hora = tela.querySelector('.js-aj-hora').value, motivo = tela.querySelector('.js-aj-motivo').value.trim();
      const erro = tela.querySelector('.js-aj-erro');
      if (!hora || !motivo){ erro.textContent = 'Preencha o horário e o motivo.'; return; }
      erro.textContent = '';
      const dia = tela.querySelector('[data-campo=dia] .on').textContent, marc = tela.querySelector('[data-campo=marc] .on').textContent;
      const padrao = {'Entrada':'08:00','Intervalo':'12:00','Retorno intervalo':'13:00','Saída':'17:00'}[marc];
      estado.pedidos.unshift({dia, marc, de:padrao, para:hora, motivo, status:'ag', quando:'31/01 (hoje)'});
      ir('aprovacoes'); avisar('Pedido enviado. O empregador vai receber uma notificação.'); return;
    }
    if (d.chave){ estado.chaves[d.chave] = !estado.chaves[d.chave]; render(visor); return; }
    if (act==='reiniciar'){ estado = estadoInicial(); ir('ponto'); avisar('Demonstração reiniciada.'); return; }
    if (d.go === 'ajuste') visor.querySelector('.js-aj-voltar').dataset.go = visor.querySelector('.tela.ativa').dataset.id;
    if (d.go) ir(d.go);
  });
}
</script>
</body>
</html>
