<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pode Regularizar · App do vendedor (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* Layout das telas finais do case; branding do app oficial voce.poderegularizar.com.br:
     logo oficial, Roboto, azul #166AFF/#1A67F0, laranja #F07E26 e verde dos checks. */
  :root{
    --azul:#1a67f0; --azul-logo:#166aff; --azul-esc:#0f4fc4; --azul-claro:#e8f0fe;
    --laranja:#f07e26; --laranja-claro:#fff1e6; --verde:#00c58e; --verde-txt:#0a9a6e; --verde-claro:#e3f9f1;
    --rosa:#ffb282; --erro:#eb445a;
    --preto:#262626; --texto:#666; --suave:#979797; --linha:#e6e6e6; --fundo:#f4f5f8; --branco:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Roboto",system-ui,sans-serif;background:#eef1f6;color:var(--preto);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px}
  button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;text-align:inherit}
  input{font:inherit}

  .topo{text-align:center;margin-bottom:18px;color:var(--preto)}
  .topo h1{font-size:18px;font-weight:700}
  .topo p{font-size:13px;color:var(--texto);margin-top:4px}
  .topo .selo-ficticio{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--laranja);background:var(--laranja-claro);border-radius:999px;padding:4px 12px}
  .topo a{color:var(--azul);font-weight:600}
  .celular{width:390px;height:844px;border-radius:50px;background:#111;padding:11px;box-shadow:0 30px 70px -24px rgba(16,40,90,.45),inset 0 0 0 2px #2a2a2a}
  .visor{width:100%;height:100%;border-radius:40px;overflow:clip;position:relative;background:var(--fundo)}

  /* ---------- tela ---------- */
  .tela{position:absolute;inset:0;display:flex;flex-direction:column;overflow:clip;background:var(--fundo);opacity:0;pointer-events:none;transform:translateX(20px);transition:opacity .28s ease,transform .28s ease}
  .tela.ativa{opacity:1;pointer-events:auto;transform:none}
  .status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:700}
  .status i{font-style:normal;letter-spacing:1px;font-size:11px}
  .aviso-topo{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;font-size:9.5px;font-weight:700;color:var(--laranja);background:var(--laranja-claro);border-radius:999px;padding:2px 9px;white-space:nowrap;pointer-events:none}
  .conteudo{flex:1;overflow-y:auto;padding:0 0 18px}
  .conteudo::-webkit-scrollbar{width:0}
  .pad{padding:0 16px}

  /* cabeçalho branco com título central (telas finais) */
  .cab{background:#fff;flex:none;border-bottom:1px solid var(--linha)}
  .cab-linha{height:50px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:6px 8px 0}
  .cab-linha h2{text-align:center;font-size:15px;font-weight:700}
  .ic-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;position:relative}
  .ic-btn svg{width:22px;height:22px}
  .ic-btn.laranja{color:var(--laranja)}
  .ic-btn.azul{color:var(--azul)}
  .ponto{position:absolute;top:6px;right:7px;min-width:15px;height:15px;border-radius:8px;background:var(--azul);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px;border:2px solid #fff}
  .logo{display:block;height:34px;margin:0 auto}
  .logo img{height:100%;display:block}

  /* blocos brancos separados por linha (como nas telas do case) */
  .bloco{background:#fff;border-bottom:1px solid var(--linha);padding:14px 16px}
  .bloco + .bloco{margin-top:0}
  .sec{margin-top:10px}
  .rot{font-size:12px;color:var(--texto)}
  .h-sec{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
  .link{color:var(--azul);font-size:12px;font-weight:500}
  .link-lj{color:var(--laranja);font-weight:700}
  .valor{font-size:20px;font-weight:700;margin-top:2px}
  .chip-up{font-size:11px;font-weight:700;color:#fff;background:var(--azul);border-radius:6px;padding:4px 8px}
  .verde-txt{color:var(--verde-txt);font-weight:700}

  /* meta (versão B do teste A/B) */
  .meta-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700}
  .meta-top b{color:var(--verde-txt);font-size:15px}
  .barra{height:9px;border-radius:5px;background:var(--linha);margin-top:10px;overflow:hidden}
  .barra i{display:block;height:100%;border-radius:5px;background:var(--verde);transition:width .8s ease}
  .barra.lj i{background:var(--laranja)}
  .linha-meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  .falta{font-size:12.5px;color:var(--texto);margin-top:8px}
  .falta b{color:var(--preto)}
  .grafico{margin-top:8px;height:110px;position:relative}
  .grafico svg{width:100%;height:100%;display:block}
  .eixo{display:flex;justify-content:space-between;font-size:9.5px;color:var(--suave);margin-top:2px}

  /* card de agenda (design system) */
  .agenda-card{display:grid;grid-template-columns:30px 1fr 30px;gap:10px;align-items:center;margin-top:10px}
  .seta{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:#fff;background:var(--azul)}
  .seta.cinza{background:#bdbdbd}
  .seta svg{width:16px;height:16px}
  .agenda-card .info{font-size:12px;line-height:1.45;text-align:left}
  .agenda-card .info b{color:var(--azul)}
  .agenda-card .info strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.2px}
  .agenda-card .info small{color:var(--texto);font-size:11.5px}
  .atalhos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
  .atalho{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9.5px;color:var(--texto);text-align:center;line-height:1.15}
  .atalho span.q{width:50px;height:50px;border-radius:12px;border:1.5px solid #f6c39b;background:#fff;display:grid;place-items:center;color:var(--laranja);transition:transform .12s}
  .atalho:active span.q{transform:scale(.94)}
  .atalho svg{width:28px;height:28px}

  /* busca */
  .busca{display:flex;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--linha)}
  .campo-busca{flex:1;height:40px;border:1px solid #d7d8da;border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--suave);background:#fff}
  .campo-busca input{border:0;outline:none;flex:1;font-size:13px;color:var(--preto);min-width:0;background:transparent}
  .campo-busca svg{width:18px;height:18px;flex:none}
  .btn-filtro{width:40px;height:40px;border-radius:6px;background:var(--azul);color:#fff;display:grid;place-items:center}
  .btn-filtro svg{width:20px;height:20px}
  .btn-cinza{height:40px;border-radius:6px;background:#e9e9ec;color:var(--texto);font-size:13px;font-weight:500;padding:0 14px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 2px;background:#fff}
  .chips::-webkit-scrollbar{height:0}
  .chip{flex:none;font-size:11.5px;font-weight:500;border:1px solid #d7d8da;border-radius:999px;padding:6px 11px;background:#fff;color:var(--texto)}
  .chip.on{background:var(--azul);border-color:var(--azul);color:#fff}

  /* linhas de cliente */
  .lista{display:flex;flex-direction:column}
  .cli{background:#fff;border-bottom:1px solid var(--linha);padding:13px 16px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;text-align:left;width:100%}
  .cli:active{background:#fafafa}
  .cli b{font-size:13.5px;font-weight:700;display:block}
  .cli small{display:block;font-size:12px;color:var(--texto);margin-top:3px}
  .cli .motivo{display:flex;align-items:center;gap:6px;font-size:11.5px;margin-top:5px}
  .cli .motivo::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .cli svg{width:18px;height:18px;color:var(--preto)}
  .prazo{font-size:12px;font-weight:700;text-align:right}
  .st-azul{color:var(--azul)} .st-laranja{color:var(--laranja)} .st-verde{color:var(--verde-txt)} .st-cinza{color:var(--texto)}
  .novo-tag{display:inline-block;font-size:9.5px;font-weight:700;color:#fff;background:var(--laranja);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
  .vazio{text-align:center;color:var(--texto);font-size:13px;padding:30px 16px}

  /* rodapé com botão */
  .rodape{flex:none;padding:12px 16px 22px;background:#fff;border-top:1px solid var(--linha)}
  .tabbar{flex:none;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--linha);padding:8px 6px 22px;box-shadow:0 -4px 14px -10px rgba(0,0,0,.2)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:#8a94a6;width:64px;padding-top:2px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--azul);font-weight:700}
  .tabbar button.on svg{color:var(--laranja)}
  .btn{height:46px;border-radius:6px;font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .12s ease,opacity .2s}
  .btn:active{transform:scale(.98)}
  .btn svg{width:18px;height:18px}
  .btn-azul{background:var(--azul);color:#fff}
  .btn-contorno{border:1.5px solid var(--azul);color:var(--azul);background:#fff}
  .btn-laranja{background:var(--laranja);color:#fff}
  .btn.off{opacity:.45;pointer-events:none}
  .duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* agenda do dia */
  .dias{display:flex;gap:6px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--linha)}
  .dia{flex:1;border-radius:10px;padding:7px 0;text-align:center;font-size:10.5px;color:var(--texto);border:1px solid var(--linha)}
  .dia b{display:block;font-size:16px;color:var(--preto);margin-top:1px}
  .dia.on{background:var(--azul);border-color:var(--azul);color:#dfe8ff}
  .dia.on b{color:#fff}
  .compromisso{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:13px 16px;background:#fff;border-bottom:1px solid var(--linha)}
  .hora{font-size:13px;font-weight:700;color:var(--azul);padding-top:1px}
  .hora small{display:block;font-size:10px;color:var(--suave);font-weight:400}
  .compromisso .tipo{font-size:11px;font-weight:700;color:var(--azul)}
  .compromisso .tipo.lj{color:var(--laranja)}
  .compromisso .tipo.vd{color:var(--verde-txt)}
  .compromisso strong{display:block;font-size:13.5px;margin-top:2px}
  .compromisso small{display:block;font-size:12px;color:var(--texto);margin-top:2px}
  .compromisso .acoes{display:flex;gap:8px;margin-top:9px}
  .mini{height:32px;border-radius:6px;font-size:12px;font-weight:500;padding:0 12px;display:inline-flex;align-items:center;gap:6px}
  .mini.azul{background:var(--azul);color:#fff}
  .mini.cont{border:1px solid var(--azul);color:var(--azul)}
  .mini.feito{background:var(--verde-claro);color:var(--verde-txt)}
  .compromisso.on{box-shadow:inset 3px 0 0 var(--laranja)}

  /* detalhes do cliente */
  .foto-imovel{height:170px;background:#cfd6df center/cover no-repeat;flex:none;position:relative}
  .foto-imovel span{position:absolute;left:10px;bottom:10px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.92);border-radius:4px;padding:3px 7px}
  .ident b{font-size:16px;font-weight:700;display:block}
  .ident small{display:block;font-size:12.5px;color:var(--texto);margin-top:4px;line-height:1.4}
  .doc{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:#fff;border-bottom:1px solid var(--linha);font-size:13px;font-weight:500;width:100%;text-align:left}
  .doc .est{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
  .doc .est svg{width:18px;height:18px}
  .ok{color:var(--verde-txt)} .pend{color:var(--laranja)}
  .progresso-doc{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--texto)}
  .progresso-doc .barra{flex:1;margin-top:0;height:6px}

  /* formulário de cadastro */
  .passos{display:flex;gap:6px;padding:12px 16px 0;background:#fff}
  .passos i{flex:1;height:4px;border-radius:2px;background:var(--linha)}
  .passos i.on{background:var(--azul)}
  .passo-nome{font-size:11px;color:var(--texto);padding:6px 16px 10px;background:#fff;border-bottom:1px solid var(--linha)}
  .passo-nome b{color:var(--preto)}
  .form{background:#fff;padding:4px 16px 16px;border-bottom:1px solid var(--linha)}
  .campo{display:block;margin-top:12px}
  .campo span{display:flex;justify-content:space-between;font-size:11.5px;color:var(--texto);margin-bottom:4px}
  .campo input{width:100%;height:42px;border:1px solid #d7d8da;border-radius:6px;padding:0 12px;font-size:14px;color:var(--preto);outline:none;background:#fff}
  .campo input:focus{border-color:var(--azul)}
  .campo.auto input{background:var(--azul-claro);border-color:#c7d9fc}
  .tag-auto{font-size:10px;font-weight:700;color:var(--azul)}
  .duas-campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opcoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .op{border:1px solid #d7d8da;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:500;background:#fff;color:var(--texto)}
  .op.on{border-color:var(--azul);color:var(--azul);background:var(--azul-claro)}
  .aviso{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.4;background:var(--azul-claro);color:var(--azul-esc);border-radius:8px;padding:10px 12px;margin-top:14px}
  .aviso.lj{background:var(--laranja-claro);color:#a4500f}
  .aviso.vd{background:var(--verde-claro);color:#087453}
  .aviso svg{width:16px;height:16px;flex:none;margin-top:1px}

  /* fotos e documentos */
  .fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .thumb{aspect-ratio:1;border-radius:8px;background:#dfe5ee center/cover no-repeat;position:relative;overflow:hidden}
  .thumb small{position:absolute;left:4px;bottom:4px;font-size:9px;font-weight:700;background:rgba(255,255,255,.9);border-radius:3px;padding:1px 4px}
  .thumb.desenho{background:linear-gradient(160deg,#c9d6e8 0 55%,#9fb0c6 55% 100%)}
  .thumb.desenho::before{content:"";position:absolute;left:22%;right:22%;top:30%;bottom:22%;background:#f3efe7;clip-path:polygon(50% 0,100% 35%,100% 100%,0 100%,0 35%)}
  .thumb.desenho::after{content:"";position:absolute;left:43%;width:14%;top:58%;bottom:22%;background:var(--azul)}
  .thumb.add{border:1.5px dashed #b9c3d3;background:#fff;display:grid;place-items:center;color:var(--azul);font-size:11px;font-weight:500;text-align:center}
  .thumb.add svg{width:24px;height:24px;display:block;margin:0 auto 4px}
  .thumb.nova{animation:surge .35s ease}
  @keyframes surge{from{transform:scale(.7);opacity:0}}
  .doc-up{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--linha)}
  .doc-up .clip{color:var(--texto)}
  .doc-up .clip svg{width:26px;height:26px}
  .doc-up b{font-size:13.5px;font-weight:500;display:block}
  .doc-up small{font-size:11px;color:var(--texto);display:block}
  .doc-up .check{width:22px;height:22px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center}
  .doc-up .check svg{width:14px;height:14px}
  .doc-up .enviar{font-size:12px;font-weight:700;color:var(--laranja);border:1px solid #f6c39b;border-radius:6px;padding:6px 10px}
  .ajuda{text-align:center;font-size:12px;color:var(--texto);padding:12px 16px}

  /* validação técnica */
  .val-topo{background:#fff;padding:22px 16px 18px;text-align:center;border-bottom:1px solid var(--linha)}
  .anel{width:92px;height:92px;border-radius:50%;margin:0 auto;display:grid;place-items:center;position:relative;background:conic-gradient(var(--azul) calc(var(--p,0)*1%),var(--linha) 0)}
  .anel::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}
  .anel b{position:relative;font-size:20px;font-weight:700}
  .anel.ok{background:var(--verde)} .anel.ok::before{display:none}
  .anel.pend{background:var(--laranja)} .anel.pend::before{display:none}
  .anel svg{position:relative;width:42px;height:42px;color:#fff}
  .val-topo h3{font-size:17px;font-weight:700;margin-top:14px}
  .val-topo p{font-size:12.5px;color:var(--texto);margin-top:5px;line-height:1.4}
  .regra{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--linha);font-size:13px}
  .regra small{display:block;font-size:11px;color:var(--texto);margin-top:1px}
  .regra .r-ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--linha);color:#fff}
  .regra .r-ic svg{width:13px;height:13px}
  .regra.ok .r-ic{background:var(--verde);border-color:var(--verde)}
  .regra.pend .r-ic{background:var(--laranja);border-color:var(--laranja)}
  .regra.rodando .r-ic{border-color:var(--azul);border-top-color:transparent;animation:gira .7s linear infinite}
  .regra .r-est{font-size:11px;font-weight:700}
  @keyframes gira{to{transform:rotate(360deg)}}

  /* sucesso */
  .sucesso{align-items:center;justify-content:center;text-align:center;padding:30px 26px;background:#fff}
  .selo{width:96px;height:96px;border-radius:50%;background:var(--verde);display:grid;place-items:center;color:#fff;box-shadow:0 0 0 12px var(--verde-claro)}
  .selo svg{width:46px;height:46px}
  .sucesso h2{font-size:22px;font-weight:700;margin-top:30px}
  .sucesso p{color:var(--texto);margin-top:8px;font-size:14px;line-height:1.45}
  .cronometro{display:inline-flex;gap:8px;align-items:center;background:var(--azul-claro);color:var(--azul-esc);font-weight:700;border-radius:999px;padding:8px 14px;margin-top:18px;font-size:13px}
  .cronometro svg{width:18px;height:18px;flex:none}
  .resumo-envio{width:100%;border:1px solid var(--linha);border-radius:10px;margin-top:20px;text-align:left;font-size:12.5px}
  .resumo-envio div{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--linha)}
  .resumo-envio div:last-child{border-bottom:0}
  .resumo-envio span{color:var(--texto)}
  .sucesso .btn{margin-top:12px}

  /* menu */
  .menu-cab{background:var(--azul);color:#fff;padding:0 18px 20px;flex:none}
  .menu-cab .status{padding:0 10px;color:#fff}
  .perfil{display:flex;gap:12px;align-items:center;margin-top:8px}
  .avatar{width:50px;height:50px;border-radius:50%;background:#fff;color:var(--azul);display:grid;place-items:center;font-weight:700;font-size:18px}
  .perfil b{font-size:16px;display:block}
  .perfil small{font-size:12px;opacity:.85}
  .estrelas{display:flex;gap:2px;align-items:center;margin-top:4px;font-size:12px;font-weight:700}
  .estrelas svg{width:14px;height:14px}
  .item-menu{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid var(--linha);font-size:14px;width:100%;text-align:left}
  .item-menu .mi{color:var(--laranja)}
  .item-menu .mi svg{width:24px;height:24px}
  .item-menu small{font-size:11px;color:var(--texto);display:block}
  .item-menu .n{font-size:11px;font-weight:700;color:#fff;background:var(--azul);border-radius:999px;padding:2px 8px}

  /* métricas */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--linha);margin-top:12px;border:1px solid var(--linha);border-radius:8px;overflow:hidden}

  .quadro .moldura{width:390px;height:844px;position:relative;overflow:hidden;border-radius:30px;background:var(--fundo);box-shadow:0 10px 30px -18px rgba(0,0,0,.4)}

const modoTelas = new URLSearchParams(location.search).has('telas');

function preparar(raiz){
  raiz.innerHTML = raiz.innerHTML.replace(/#([a-z]+)\b/g, (m,k)=> IC[k] || m);
  raiz.querySelectorAll('.tela').forEach(t=>{ if(!t.classList.contains('sucesso')) t.insertAdjacentHTML('beforeend','<span class="aviso-topo">Recriação ilustrativa · dados fictícios</span>'); });
  // Barra inferior nas telas principais (o rodapé com os botões do app).
  const ABAS = [['home','Início',IC.tabCasa],['agenda','Agenda',IC.tabAgenda],['meus','Clientes',IC.tabClientes],['metricas','Métricas',IC.tabMetricas],['menu','Menu',IC.menu]];
  raiz.querySelectorAll('.tela').forEach(t=>{
    const id = t.dataset.id; if (!ABAS.some(a=>a[0]===id)) return;
    t.insertAdjacentHTML('beforeend', `<nav class="tabbar">${ABAS.map(([go,rot,ic])=>`<button class="${go===id?'on':''}" data-go="${go}">${ic}<span>${rot}</span></button>`).join('')}</nav>`);
  });
  render(raiz);
}

/* regras da validação técnica, a partir do que o vendedor coletou */
function regras(){
  const d = estado.cad.docs, f = estado.cad.fotos;
  return [
    {t:'Fotos da fachada e do lote', s:'Mínimo de 2 fotos legíveis', ok: f>=2},
    {t:'Endereço confere com quadra e lote', s:'Base da REURB', ok:true},
    {t:'Documentos pessoais', s:'RG e CPF do proprietário', ok:!!d[0]},
    {t:'Comprovante de endereço', s:'Emitido nos últimos 90 dias', ok:!!d[1]},
    {t:'Contrato de compra e venda', s:'Prova da posse do imóvel', ok:!!d[2]},
    {t:'Documentos do imóvel', s:'IPTU ou carnê do lote', ok:!!d[3]},
  ];
}

function cliHTML(c, tipo){
  if (tipo==='banco') return `<button class="cli" data-cli="${c.id}" data-origem="banco"><span><b>${c.nome}</b><small>Quantidade de imóveis: ${c.imoveis}</small>
    <span class="motivo st-${c.cor}">${c.motivo}</span></span>${IC.seta}</button>`;
  const cor = STATUS[c.status].cor;
  return `<button class="cli" data-cli="${c.id}" data-origem="meus"><span><b>${c.nome}${c.novo?'<span class="novo-tag">novo</span>':''}</b><small>Quantidade de imóveis: ${c.imoveis}</small>
    <small>Status: <span class="st-${cor}">${c.status}</span></small></span><span class="prazo st-${cor==='verde'?'cinza':cor}">${c.prazo}</span></button>`;
}

function render(raiz){
  const q = s => raiz.querySelectorAll(s);
  /* meta */
  const pct = Math.min(100, Math.round(estado.receita/estado.alvo*100));
  const falta = Math.max(0, estado.alvo-estado.receita);
  q('.js-meta-pct').forEach(e=>e.textContent=pct+'%');
  q('.js-meta-barra').forEach(e=>e.style.width=pct+'%');
  q('.js-falta').forEach(e=>e.innerHTML = falta ? `Falta <b>${reais(falta)}</b> para alcançar a meta` : '<b>Meta do mês alcançada!</b>');
  q('.js-falta-curta').forEach(e=>e.textContent = falta ? 'Falta: '+reais(falta).replace(',00','') : 'Meta alcançada');
  q('.js-receita').forEach(e=>e.textContent=reais(estado.receita));
  q('.js-atendidos').forEach(e=>e.textContent=estado.atendidos);
  q('.js-bonus').forEach(e=>e.textContent=reais(estado.atendidos*60));
  q('.js-pendentes').forEach(e=>e.textContent=estado.meus.filter(c=>c.status==='Documentos pendentes').length + estado.banco.filter(c=>c.cor==='laranja').length);

  /* card de agenda da home */
  const ag = AGENDA[estado.agIdx], agc = achar(ag.cli);
  q('.js-ag-info').forEach(e=>e.innerHTML = `<b>${ag.tipo}</b> às ${ag.hora}<strong>${agc.nome}</strong><small>${agc.end.split(',')[0]}</small>`);
  q('.js-ag-ant').forEach(e=>e.classList.toggle('cinza', estado.agIdx===0));
  q('.js-ag-prox').forEach(e=>e.classList.toggle('cinza', estado.agIdx===AGENDA.length-1));

  /* agenda do dia */
  q('.js-agenda').forEach(l=>l.innerHTML = AGENDA.map((a,i)=>{
    const c = achar(a.cli), feito = estado.feitos[i];
    return `<div class="compromisso ${i===estado.agIdx?'on':''}"><span class="hora">${a.hora}<small>${i<1?'em 50 min':''}</small></span>
      <span><span class="tipo ${a.lj?'lj':''} ${a.vd?'vd':''}">${a.tipo}</span><strong>${c.nome}</strong><small>${c.end}</small><small>${a.obs}</small>
      <span class="acoes">${feito?`<span class="mini feito">${IC.ok.replace('<svg','<svg width="14" height="14"')} Visita feita</span>`
        :`<button class="mini azul" data-visita="${i}">Iniciar visita</button>`}${a.cli!=='novo'?`<button class="mini cont" data-cli="${a.cli}" data-origem="agenda">Ver cliente</button>`:''}</span></span></div>`;
  }).join(''));

  /* banco de clientes */
  const bb = estado.buscaBanco.toLowerCase();
  q('.js-chips-banco').forEach(c=>{ c.style.display = estado.filtroBanco?'flex':'none';
    c.innerHTML = ['Todos','Documentos pendentes','Burocracia do órgão','Em análise'].map(x=>`<button class="chip ${x===(estado.chipBanco||'Todos')?'on':''}" data-chipbanco="${x}">${x}</button>`).join(''); });
  q('.js-banco').forEach(l=>{
    const lst = estado.banco.filter(c=>(!bb || (c.nome+c.motivo).toLowerCase().includes(bb)) && (!estado.chipBanco || estado.chipBanco==='Todos' || c.motivo.includes(estado.chipBanco.replace('Em análise','análise'))));
    l.innerHTML = lst.length ? lst.map(c=>cliHTML(c,'banco')).join('') : '<p class="vazio">Nenhum cliente encontrado.</p>';
  });

  /* meus clientes */
  q('.js-chips-meus').forEach(c=>c.innerHTML = ['Todos', ...Object.keys(STATUS)].map(x=>`<button class="chip ${x===estado.filtroMeus?'on':''}" data-chipmeus="${x}">${x}</button>`).join(''));
  q('.js-meus').forEach(l=>{
    const b = estado.buscaMeus.toLowerCase();
    const lst = estado.meus.filter(c=>(estado.filtroMeus==='Todos'||c.status===estado.filtroMeus) && (!b || (c.status+c.nome).toLowerCase().includes(b)));
    l.innerHTML = lst.length ? lst.map(c=>cliHTML(c,'meus')).join('') : '<p class="vazio">Nenhum cliente com esse status.</p>';
  });
  q('.js-n-meus').forEach(e=>e.textContent=estado.meus.length);
  q('.js-n-banco').forEach(e=>e.textContent=estado.banco.length);
  q('.js-n-agenda').forEach(e=>e.textContent=AGENDA.length-Object.keys(estado.feitos).length);

  /* detalhes */
  const c = achar(estado.sel);
  const env = c.docs.filter(Boolean).length;
  q('.js-det-nome').forEach(e=>e.textContent=c.nome);
  q('.js-det-end').forEach(e=>e.textContent=c.end);
  q('.js-det-foto').forEach(e=>e.style.backgroundImage = `url(img/fachada.jpg)`);
  q('.js-det-status').forEach(e=>e.textContent = c.status ? 'Status: '+c.status : (c.motivo ? 'Parado: '+c.motivo : 'Novo cadastro'));
  q('.js-det-barra').forEach(e=>e.style.width=(env/DOCS.length*100)+'%');
  q('.js-det-cont').forEach(e=>e.textContent=`${env} de ${DOCS.length} enviados`);
  q('.js-det-docs').forEach(l=>l.innerHTML = DOCS.map((d,i)=>`<div class="doc"><span>${d}</span>${c.docs[i]
    ?`<span class="est ok">Enviado ${IC.okc}</span>`:`<span class="est pend">Pendente ${IC.pend}</span>`}</div>`).join(''));
  q('.js-voltar-det').forEach(e=>e.dataset.go = estado.origem);

  /* cadastro */
  const cc = achar(estado.cad.cli);
  q('.js-cad-nome').forEach(e=>e.value=cc.nome);
  q('.js-cad-end').forEach(e=>e.value=cc.end.split(' · ').slice(-1)[0].includes('São Paulo') && cc.id!=='novo' ? cc.end.replace(/^Qd \d+ · Lote \d+ · /,'Rua Projetada, s/n · ') : cc.end);
  const m = cc.end.match(/Qd (\d+) · Lote (\d+) · ([^,]+)/);
  q('.js-cad-qd').forEach(e=>e.value = cc.qd || (m?m[1]:''));
  q('.js-cad-lt').forEach(e=>e.value = cc.lt || (m?m[2]:''));
  q('.js-cad-nucleo').forEach(e=>e.value = cc.nucleo || (m? m[3]+' · Núcleo '+(100+parseInt(m[1])*7):''));

  /* fotos e documentos */
  const f = estado.cad.fotos;
  q('.js-fotos-cont').forEach(e=>e.textContent=`${f} de 6`);
  q('.js-fotos').forEach(g=>{
    let h = '';
    for (let i=0;i<f;i++) h += i===0 ? `<span class="thumb ${i===f-1&&estado.fotoNova?'nova':''}" style="background-image:url(img/fachada.jpg)"><small>Fachada</small></span>`
      : `<span class="thumb desenho ${i===f-1&&estado.fotoNova?'nova':''}"><small>${['Lote','Fundos','Lateral','Interior','Medidor'][i-1]}</small></span>`;
    if (f<6) h += `<button class="thumb add js-foto-add">${IC.camera}Tirar foto</button>`;
    g.innerHTML = h;
  });
  const dk = estado.cad.docs;
  q('.js-docs-cont').forEach(e=>e.textContent=`${dk.filter(Boolean).length} de ${DOCS.length}`);
  q('.js-docs-up').forEach(l=>l.innerHTML = DOCS.map((d,i)=>`<div class="doc-up"><span class="clip">${IC.clipe}</span>
    <span><b>${d}</b><small>${dk[i]?`${['rg-cpf','comprovante','contrato','iptu','certidoes'][i]}.jpg · enviado`:'Foto ou PDF'}</small></span>
    ${dk[i]?`<span class="check">${IC.ok}</span>`:`<button class="enviar" data-doc="${i}">Enviar</button>`}</div>`).join(''));

  /* validação */
  const rs = regras(), fase = estado.val.fase, vi = estado.val.i;
  const nok = rs.filter(r=>!r.ok);
  q('.js-regras').forEach(l=>l.innerHTML = rs.map((r,i)=>{
    let cls='', est='';
    if (fase==='rodando'){ if(i<vi){cls=r.ok?'ok':'pend'; est=r.ok?'<span class="r-est ok">OK</span>':'<span class="r-est pend">Pendente</span>';} else if(i===vi){cls='rodando'; est='<span class="r-est st-azul">Verificando</span>';} }
    else if (fase!=='idle'){ cls=r.ok?'ok':'pend'; est=r.ok?'<span class="r-est ok">OK</span>':'<span class="r-est pend">Pendente</span>'; }
    const ic = cls==='ok'?IC.ok:cls==='pend'?'!':'';
    return `<div class="regra ${cls}"><span class="r-ic">${ic}</span><span>${r.t}<small>${r.s}</small></span>${est}</div>`;
  }).join(''));
  q('.js-val-topo').forEach(t=>{
    if (fase==='rodando'){ const p=Math.round(vi/rs.length*100); t.innerHTML=`<div class="anel" style="--p:${p}"><b>${p}%</b></div><h3>Validando o cadastro…</h3><p>Conferindo fotos, documentos e dados do lote com as regras técnicas da engenharia.</p>`; }
    else if (fase==='fim' && !nok.length){ t.innerHTML=`<div class="anel ok">${IC.okgrande}</div><h3>Cadastro aprovado na validação</h3><p>Tudo certo para seguir à engenharia e à prefeitura, sem voltar a campo.</p>`; }
    else if (fase==='fim'){ t.innerHTML=`<div class="anel pend">${IC.alerta}</div><h3>${nok.length} ${nok.length>1?'pendências encontradas':'pendência encontrada'}</h3><p>Resolva agora, ainda na casa do cliente, e evite o retrabalho de uma nova visita.</p>`; }
    else t.innerHTML=`<div class="anel" style="--p:0"><b>0%</b></div><h3>Validação técnica antecipada</h3><p>O app confere o cadastro antes do envio.</p>`;
  });
  q('.js-val-rodape').forEach(r=>{
    if (fase==='fim' && !nok.length) r.innerHTML='<button class="btn btn-azul js-enviar-proc">Enviar para a engenharia</button>';
    else if (fase==='fim') r.innerHTML='<div class="duas"><button class="btn btn-contorno js-enviar-proc">Enviar assim</button><button class="btn btn-laranja" data-go="docs">Resolver agora</button></div>';
    else r.innerHTML='<button class="btn btn-azul off">Validando…</button>';
  });

  /* enviado */
  q('.js-env-nome').forEach(e=>e.textContent=cc.nome);
  q('.js-env-docs').forEach(e=>e.textContent=`${f} fotos · ${dk.filter(Boolean).length} de ${DOCS.length} docs`);
}

if (modoTelas) {
  /* mostra a validação concluída no quadro */
  estado.val = {fase:'fim', i:6}; estado.cad.fotos = 3;
  const quadro = document.getElementById('quadro');
  [...molde.querySelectorAll('.tela')].forEach(t=>{
    const fig = document.createElement('figure');
    fig.innerHTML = `<figcaption>${t.dataset.nome}</figcaption><div class="moldura"></div>`;
    const c = t.cloneNode(true); c.classList.add('ativa');
    fig.querySelector('.moldura').appendChild(c);
    quadro.appendChild(fig);
  });
  preparar(quadro);
} else {
  const visor = document.getElementById('visor');
  visor.appendChild(molde.cloneNode(true));
  visor.insertAdjacentHTML('beforeend','<div class="toast" id="toast"></div>');
  preparar(visor);
  let tt;
  const toast = txt => { const t = document.getElementById('toast'); t.textContent = txt; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('on'), 2200); };
  let timer;
  const rodarValidacao = () => {
    clearTimeout(timer); estado.val = {fase:'rodando', i:0}; render(visor);
    const passo = () => { estado.val.i++; if (estado.val.i >= regras().length) { estado.val.fase='fim'; render(visor); return; } render(visor); timer = setTimeout(passo, 420); };
    timer = setTimeout(passo, 420);
  };
  const ir = id => {
    visor.querySelectorAll('.tela').forEach(t=>t.classList.toggle('ativa', t.dataset.id===id));
    const c = visor.querySelector('.tela.ativa .conteudo'); if (c) c.scrollTop = 0;
    estado.fotoNova = false;
    render(visor);
    if (id==='validacao') rodarValidacao(); else clearTimeout(timer);
  };
  const abrirCadastro = id => {
    const c = achar(id);
    estado.cad = {cli:c.id, fotos: c.id==='novo'?0:1, docs:[...c.docs]};
  };
  ir('home');

  visor.addEventListener('input', e=>{
    if (e.target.classList.contains('js-busca-banco')) { estado.buscaBanco = e.target.value; render(visor); e.target.focus(); }
  });
  visor.addEventListener('keydown', e=>{
    if (e.key==='Enter' && e.target.classList.contains('js-busca-meus')) { estado.buscaMeus = e.target.value; estado.filtroMeus='Todos'; render(visor); }
  });

  visor.addEventListener('click', e=>{
    const el = e.target.closest('button'); if (!el) return;
    const d = el.dataset;
    if (d.toast) { toast(d.toast); return; }
    if (el.classList.contains('js-ag-prox')) { estado.agIdx = Math.min(AGENDA.length-1, estado.agIdx+1); render(visor); return; }
    if (el.classList.contains('js-ag-ant')) { estado.agIdx = Math.max(0, estado.agIdx-1); render(visor); return; }
    if (d.chipmeus) { estado.filtroMeus = d.chipmeus; estado.buscaMeus=''; visor.querySelectorAll('.js-busca-meus').forEach(i=>i.value=''); render(visor); return; }
    if (el.classList.contains('js-buscar')) { estado.buscaMeus = visor.querySelector('.tela.ativa .js-busca-meus').value; estado.filtroMeus='Todos'; render(visor); return; }
    if (el.classList.contains('js-filtro-banco')) { estado.filtroBanco = !estado.filtroBanco; render(visor); return; }
    if (d.chipbanco) { estado.chipBanco = d.chipbanco; render(visor); return; }
    if (d.cli) { estado.sel = d.cli; estado.origem = d.origem || 'meus'; ir('detalhe'); return; }
    if (d.visita !== undefined) { const a = AGENDA[+d.visita]; estado.agIdx = +d.visita; estado.visitaAtual = +d.visita; abrirCadastro(a.cli); ir('cadastro'); return; }
    if (el.classList.contains('op')) { el.parentElement.querySelectorAll('.op').forEach(o=>o.classList.remove('on')); el.classList.add('on'); return; }
    if (el.classList.contains('js-foto-add')) { estado.cad.fotos = Math.min(6, estado.cad.fotos+1); estado.fotoNova = true; render(visor); estado.fotoNova = false; toast('Foto anexada ao cadastro.'); return; }
    if (d.doc !== undefined) { estado.cad.docs[+d.doc] = 1; render(visor); toast(DOCS[+d.doc]+' enviado.'); return; }
    if (el.classList.contains('js-enviar-proc')) {
      const id = estado.cad.cli;
      let c = estado.meus.find(x=>x.id===id);
      const base = c || estado.banco.find(x=>x.id===id) || NOVO;
      const pend = estado.cad.docs.some(x=>!x);
      const nc = {...base, docs:[...estado.cad.docs], status: pend?'Documentos pendentes':'Em análise', prazo:'30 dias', novo:true};
      delete nc.motivo; delete nc.cor;
      estado.meus = [nc, ...estado.meus.filter(x=>x.id!==id)];
      estado.banco = estado.banco.filter(x=>x.id!==id);
      estado.atendidos++; estado.receita = Math.min(estado.alvo+15000, estado.receita + 6000);
      if (estado.visitaAtual !== undefined) { estado.feitos[estado.visitaAtual] = true; estado.visitaAtual = undefined; }
      estado.filtroMeus = 'Todos'; estado.buscaMeus = '';
      ir('enviado'); return;
    }
    if (d.acao === 'novo') { abrirCadastro('novo'); estado.visitaAtual = 3; }
    if (d.acao === 'atender') abrirCadastro(estado.sel);
    if (d.go) ir(d.go);
  });
}
</script>
<script>
/* Embutido no portfólio: Esc dentro do protótipo fecha a janela de tela cheia. */
if (window.parent !== window) addEventListener('keydown', e => { if (e.key === 'Escape') parent.postMessage('fechar-prototipo', location.origin); });
</script>
