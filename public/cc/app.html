<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<base href="/cc/">
<title>Fulfillment Ops · Field app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Field app in the Amazon visual language: navy top bar, yellow action, surfaces by tone. */
  :root{
    --squid:#131921; --nav:#232F3E; --nav2:#37475A; --yellow:#FFD814; --yellow-h:#F7CA00; --orange:#FF9900; --link:#007185;
    --ink:#0F1111; --muted:#565959; --page:#EAEDED; --card:#fff; --tone:#F3F4F4; --tone2:#E3E6E6; --me:#E7F4F5;
    --crit:#B12704; --crit-bg:#FCE7E3; --high:#C45500; --high-bg:#FFEEDB; --med:#7A6A00; --med-bg:#FFF6CC; --low:#565959; --low-bg:#EEF0F0; --ok:#067D62; --ok-bg:#DDF3EC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font:16px/1.45 "Open Sans","Amazon Ember",Arial,sans-serif;color:var(--ink);background:#1B2430;display:grid;place-items:center;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  .hidden{display:none!important}
  svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  :focus-visible{outline:3px solid var(--orange);outline-offset:2px}

  .phone{width:400px;height:840px;max-height:100svh;background:var(--page);border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 12px #0B0F14} /* taste-skill-ignore: device frame for the demo */
  @media (max-width:520px){ body{display:block;background:var(--page)} .phone{width:100%;height:100dvh;max-height:none;border-radius:0;box-shadow:none} }
  .scr{flex:1;overflow:auto;position:relative}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border:0;border-radius:999px;background:var(--yellow);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;color:var(--ink);transition:background .15s,transform .1s}
  .btn:hover{background:var(--yellow-h)} .btn:active{transform:scale(.97)}
  .btn.full{width:100%}
  .btn.soft{background:var(--tone2);font-weight:600} .btn.soft:hover{background:#D7DBDB}
  .btn.dark{background:var(--nav);color:#fff}
  .btn.danger{background:var(--crit-bg);color:var(--crit)}
  .btn.half{flex:1;min-height:46px;font-size:15px}

  /* topo */
  .bar{background:var(--nav);color:#fff;padding:18px 20px 18px;flex:none}
  .bar .l1{display:flex;align-items:center;gap:10px}
  .wordmark{display:inline-flex;align-items:baseline;gap:5px;font-weight:800;font-size:22px;letter-spacing:-.04em}
  .wordmark small{font-size:13px;font-weight:700;color:var(--orange);letter-spacing:0}
  .bar .sp{flex:1}
  .av{width:36px;height:36px;border-radius:50%;background:var(--orange);color:var(--squid);display:grid;place-items:center;font-weight:800;font-size:13px}
  .hello{margin-top:14px;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .hello small{display:block;font-weight:500;color:#B9C2CC;font-size:14px;letter-spacing:0;margin-top:4px}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .num{background:var(--nav2);border-radius:12px;padding:10px 12px}
  .num b{display:block;font-size:22px;color:#fff;line-height:1.1}
  .num span{font-size:12.5px;color:#C9D1DA}

  .seg{display:flex;gap:6px;padding:16px 16px 4px;overflow:auto}
  .seg button{border:0;background:var(--card);border-radius:999px;padding:8px 16px;white-space:nowrap;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--nav);color:#fff}

  .chip{display:inline-flex;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .crit{color:var(--crit);background:var(--crit-bg)} .high{color:var(--high);background:var(--high-bg)}
  .med{color:var(--med);background:var(--med-bg)} .low{color:var(--low);background:var(--low-bg)}
  .lvl{position:relative}
  .lvl::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 4px 4px 0;background:#C8CCCC}
  .lvl.crit::before{background:var(--crit)} .lvl.high::before{background:var(--high)} .lvl.med::before{background:#C9B100}
  .lvl.crit,.lvl.high,.lvl.med,.lvl.low{background:var(--card);color:inherit}

  .sec{padding:14px 16px 0}
  .sec h2{font-size:18px;margin:6px 4px 10px;letter-spacing:-.01em}
  .card{background:var(--card);border-radius:16px}
  .next{padding:18px 18px 18px 22px}
  .next .t{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:8px 0 6px;line-height:1.15}
  .addr{display:flex;gap:8px;color:var(--ink);align-items:flex-start;margin:6px 0;font-size:15px}
  .addr svg.ic{width:20px;height:20px;margin-top:2px;color:var(--link)}
  .why{color:var(--muted);font-size:14px} .why b{color:var(--crit)}
  .btns{display:flex;gap:8px;margin-top:14px}
  .list{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;gap:12px;align-items:center;padding:14px 16px 14px 20px;cursor:pointer;width:100%;text-align:left;border:0;border-radius:14px}
  .item .b{flex:1;min-width:0}
  .item .b b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px}
  .item .b small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
  .item .r{text-align:right;font-size:13px;font-weight:700;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .item .r.late{color:var(--crit)}
  .ti{width:40px;height:40px;border-radius:50%;background:var(--tone);color:var(--nav);display:grid;place-items:center;flex:none}
  .empty{padding:36px 18px;text-align:center;color:var(--muted)}

  .nav{display:flex;background:var(--card);flex:none;padding-bottom:6px}
  .nav button{flex:1;border:0;background:transparent;padding:10px 0 8px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:600;cursor:pointer;position:relative}
  .nav button.on{color:var(--nav);font-weight:800}
  .nav button.on::after{content:"";position:absolute;top:0;left:30%;right:30%;height:4px;border-radius:0 0 4px 4px;background:var(--orange)}
  .nav .ub{position:absolute;top:6px;left:calc(50% + 6px)}
  .ub{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#E31B23;color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}

  /* detalhe */
  #det{position:absolute;inset:0;background:var(--page);display:flex;flex-direction:column;z-index:5}
  .dh{background:var(--nav);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;flex:none}
  .dh button{background:transparent;border:0;color:#fff;padding:6px;cursor:pointer;display:grid;border-radius:50%}
  .dh button:hover{background:var(--nav2)}
  .dh b{font-size:17px}
  .db{flex:1;overflow:auto;padding:16px}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;margin:14px 0 0;font-size:15px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
  .box{padding:18px;margin-top:12px}
  .box h3{margin:0 0 10px;font-size:17px}
  .code input{width:100%;text-align:center;font-size:34px;letter-spacing:.5em;height:64px;border:0;border-radius:12px;background:var(--tone)}
  .code input:focus{outline:3px solid var(--orange);background:#fff}
  .hint{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
  .err{color:var(--crit);font-weight:700;margin-top:8px;min-height:20px;text-align:center}
  select{width:100%;height:48px;padding:0 12px;border:0;border-radius:12px;background:var(--tone)}
  .alert{background:var(--crit-bg);color:var(--crit);border-radius:12px;padding:12px 16px;margin-top:12px;font-weight:700}

  /* chat */
  .msgs{display:flex;flex-direction:column;gap:8px;padding:4px 0}
  .msg{max-width:82%;padding:10px 14px;border-radius:16px;background:var(--tone);font-size:15px;line-height:1.4}
  .msg small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  .msg.mine{align-self:flex-end;background:var(--nav);color:#fff;border-bottom-right-radius:4px}
  .msg.mine small{color:#B9C2CC}
  .msg.them{align-self:flex-start;border-bottom-left-radius:4px}
  .quick{display:flex;gap:6px;overflow:auto;margin:12px 0 8px}
  .quick button{flex:none;border:0;background:var(--me);color:var(--link);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
  .compose{display:flex;gap:8px}
  .compose input{flex:1;height:48px;border:0;border-radius:999px;padding:0 16px;background:var(--tone)}
  .compose input:focus{outline:3px solid var(--orange);background:#fff}
  .compose .btn{min-height:48px;padding:0 18px}
  .thread{display:flex;gap:12px;align-items:center;padding:14px 16px;border:0;width:100%;text-align:left;border-radius:14px;background:var(--card);cursor:pointer}
  .thread .b{flex:1;min-width:0}
  .thread .b small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* login */
  .lg{flex:1;display:flex;flex-direction:column;background:var(--card)}
  .lg-top{background:var(--nav);color:#fff;padding:56px 28px 32px;position:relative;overflow:hidden}
  .lg-top img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
  .lg-top::after{content:"";position:absolute;inset:0;background:rgba(19,25,33,.55)}
  .lg-top > *:not(img){position:relative;z-index:1}
  .lg-top .credit{font-size:11px;color:#B9C2CC;margin-top:14px}
  .lg-top .credit a{color:#B9C2CC}
  .lg-top h1{font-size:34px;line-height:1.05;letter-spacing:-.03em;margin:26px 0 8px;font-weight:800}
  .lg-top p{margin:0;color:#C9D1DA}
  .lg form{padding:24px 28px}
  .lg label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
  .lg input{width:100%;height:50px;padding:0 14px;border:0;border-radius:12px;background:var(--tone)}
  .lg input:focus{outline:3px solid var(--orange);background:#fff}
  #lerr{color:var(--crit);font-size:14px;min-height:20px;margin-top:8px;font-weight:600}
  .demo{margin:0 28px;padding:14px 16px;background:var(--tone);border-radius:12px;font-size:14px;color:var(--muted)}
  .demo b{color:var(--ink)}
  .demo button{all:unset;cursor:pointer;color:var(--link);font-weight:700}
  .ctabs{display:flex;gap:6px;background:var(--tone);padding:4px;border-radius:999px;margin-bottom:12px}
  .ctabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 10px;font-weight:700;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .ctabs button.on{background:var(--nav);color:#fff}
  .msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:13px;padding:2px}
  .typing{color:var(--muted);font-size:13.5px;padding:2px 4px}
  .callrow{display:flex;gap:8px;margin-top:12px}
  #call{position:absolute;inset:0;background:var(--squid);color:#fff;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}
  #call .av{width:96px;height:96px;font-size:32px;margin-bottom:18px}
  #call h2{margin:0;font-size:26px}
  #call p{margin:6px 0 0;color:#B9C2CC}
  #call .tm{font-size:34px;font-weight:800;margin:26px 0 6px;font-variant-numeric:tabular-nums}
  #call .cbtns{display:flex;gap:16px;margin-top:30px}
  #call .cb{width:64px;height:64px;border-radius:50%;border:0;background:var(--nav2);color:#fff;display:grid;place-items:center;cursor:pointer}
  #call .cb.on{background:#fff;color:var(--ink)}
  #call .cb.end{background:#E31B23}
  #call .note{font-size:13px;color:#9FAAB6;margin-top:26px}
  .toast{position:absolute;left:16px;right:16px;bottom:86px;background:var(--squid);color:#fff;border-radius:14px;padding:14px 16px;z-index:9;font-size:15px;font-weight:600}
  @media (prefers-reduced-motion:reduce){ .btn{transition:none} }
</style>
</head>
<body>
<div class="phone" id="phone">

  <section class="lg" id="login">
    <div class="lg-top">
      <img src="assets/binders-boxes-shelves-large-archive.webp" alt="Warehouse aisle with shelves full of labeled boxes">
      <span class="wordmark">amazon <small>ops</small></span>
      <h1>Your route, by urgency.</h1>
      <p>Deliveries, batch receiving, the customer and support in one place.</p>
      <p class="credit">Photo: <a href="https://www.rawpixel.com/image/3298148/free-photo-image-warehouse-aisle-book" target="_blank" rel="noopener">“Binders boxes shelves large archive”</a>, CC0, via rawpixel.</p>
    </div>
    <form id="lform" autocomplete="off">
      <label for="u">Username</label><input id="u" required>
      <label for="p">Password</label><input id="p" type="password" required>
      <div id="lerr" role="alert"></div>
      <button class="btn dark full" type="submit" style="margin-top:6px">Sign in</button>
    </form>
    <div class="demo"><b>Prototype with fictional data.</b> Sign in with one click: <button type="button" data-fill="bruno">Bruno</button>, <button type="button" data-fill="diego">Diego</button>, <button type="button" data-fill="elisa">Elisa</button> or <button type="button" data-fill="fabio">Fabio</button> (password app123).</div>
  </section>

  <div id="app" class="hidden" data-ui style="display:none;flex-direction:column;flex:1;min-height:0">
    <div class="bar">
      <div class="l1"><span class="wordmark">amazon <small>ops</small></span><span class="sp"></span><span class="av" id="av"></span></div>
      <div class="hello" id="hello"></div>
      <div class="nums" id="nums"></div>
    </div>
    <div class="scr" id="scr"></div>
    <nav class="nav">
      <button id="nFila" class="on"></button>
      <button id="nMsg"></button>
      <button id="nEu"></button>
    </nav>
    <div id="det" class="hidden"></div>
    <div id="call" class="hidden" role="dialog" aria-label="Call"></div>
  </div>
</div>

<script src="dados.js"></script>
<script>
P.user = '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>';
P.list = '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>';
P.chat = '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.2-4.4A8 8 0 1 1 21 12z"/>';
P.headset = '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>';
P.mic = '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>';
P.speaker = '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>';
P.hang = '<path d="M3 15c5-5 13-5 18 0l-2.5 2.5-3.5-2v-3a10 10 0 0 0-6 0v3l-3.5 2z"/>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);

let session = null; try{ session = JSON.parse(sessionStorage.getItem("ops-en-app-session")); }catch(e){}
let tab = "fila", tipo = "todas", detId = null, chatOrder = null, pending = "", who = "cli", callTimer = null;
const scr = document.getElementById("scr"), det = document.getElementById("det"), appEl = document.getElementById("app");

document.querySelector(".demo").addEventListener("click", e => {
  const b = e.target.closest("[data-fill]"); if(!b) return;
  document.getElementById("u").value = b.dataset.fill; document.getElementById("p").value = "app123"; document.getElementById("lform").requestSubmit();
});
document.getElementById("lform").addEventListener("submit", e => {
  e.preventDefault(); S = load();
  const u = document.getElementById("u").value.trim().toLowerCase(), p = document.getElementById("p").value, acc = accountOf(u), err = document.getElementById("lerr");
  if(!acc || acc.pass !== p){ err.textContent = "Wrong username or password."; return; }
  if(isBlocked(u)){ err.textContent = "User blocked. Talk to your manager."; return; }
  if(acc.role !== "operacional"){ err.textContent = "This user signs in on the desktop system."; return; }
  session = { user:u, name:acc.name }; try{ sessionStorage.setItem("ops-en-app-session", JSON.stringify(session)); }catch(e){}
  start();
});
function logout(){
  session = null; try{ sessionStorage.removeItem("ops-en-app-session"); }catch(e){}
  appEl.style.display = "none"; appEl.classList.add("hidden"); document.getElementById("login").style.display = "";
  document.getElementById("p").value = ""; document.getElementById("lerr").textContent = ""; detId = null; chatOrder = null;
}

const mapLinks = addr => ({ waze:"https://waze.com/ul?q=" + encodeURIComponent(addr) + "&navigate=yes", gmaps:"https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(addr) + "&travelmode=driving" });
const mine = () => S.tasks.filter(t => t.assignee === session.user && t.status !== "done" && t.area === "operacional").sort(sorter);
const typeIcon = t => ic(t.type === "Delivery" ? "truck" : "box");
function toast(msg){ const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.getElementById("phone").appendChild(d); setTimeout(() => d.remove(), 2600); }
const fmtTime = w => new Date(w).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
/* Threads per delivery of yours: with the customer (dest:) and with support (ent:). */
const keyOf = (w, order) => (w === "cli" ? "dest:" : "ent:") + order;
const lastWhen = k => thread(k)[thread(k).length - 1].when;
const myThreads = () => mine().filter(t => t.type === "Delivery" && t.order).flatMap(t => ["cli","sac"].map(w => ({ t, w, k:keyOf(w, t.order) }))).filter(x => thread(x.k).length).sort((a,b) => lastWhen(b.k) - lastWhen(a.k));
const unreadTotal = () => myThreads().reduce((s, x) => s + unreadFor(x.k, session.user), 0);

function navBtns(t){
  if(t.type !== "Delivery") return "";
  const m = mapLinks(t.detail);
  return `<div class="btns"><a class="btn soft half" href="${m.waze}" target="_blank" rel="noopener">${ic("pin")}Waze</a><a class="btn soft half" href="${m.gmaps}" target="_blank" rel="noopener">${ic("pin")}Google Maps</a></div>`;
}
function filaView(){
  const all = mine(), list = all.filter(t => tipo === "todas" || t.type === tipo);
  const doing = list.find(t => t.status === "doing"), queue = list.filter(t => t.status !== "doing");
  const next = doing || queue[0], rest = queue.filter(t => t !== next);
  const nextBlock = next ? `<div class="sec"><h2>${doing ? "In progress now" : "Your next stop"}</h2>
      <div class="card next lvl ${level(next)}">
        ${chip(next)} <span class="why">${next.type}${next.prime ? " · Prime" : ""}</span>
        <div class="t">${next.title}</div>
        <div class="addr">${next.type === "Delivery" ? ic("pin") : ic("box")}<span>${next.detail}</span></div>
        ${next.customer ? `<div class="why">Customer: ${next.customer}</div>` : ""}
        <div class="why" style="margin-top:4px">${why(next)}</div>
        ${navBtns(next)}
        <div class="btns"><button class="btn full" data-open="${next.id}">${doing ? "Continue" : "Open stop"}</button></div>
      </div></div>` : `<div class="empty">Nothing pending for you right now.</div>`;
  const restBlock = rest.length ? `<div class="sec"><h2>Up next, by priority</h2><div class="list">` + rest.map(t => `
      <button class="item lvl ${level(t)}" data-open="${t.id}"><span class="ti">${typeIcon(t)}</span>
        <span class="b"><b>${t.title}</b><small>${t.detail}</small></span>
        <span class="r ${mins(t) < 0 ? "late" : ""}">${chip(t)}${mins(t) < 0 ? "late" : fmt(mins(t))}</span></button>`).join("") + `</div></div>` : "";
  const nE = all.filter(t => t.type === "Delivery").length, nR = all.filter(t => t.type === "Receiving").length;
  return `<div class="seg"><button class="${tipo==="todas" ? "on" : ""}" data-tipo="todas">All ${all.length}</button><button class="${tipo==="Delivery" ? "on" : ""}" data-tipo="Delivery">Deliveries ${nE}</button><button class="${tipo==="Receiving" ? "on" : ""}" data-tipo="Receiving">Receiving ${nR}</button></div>
    ${nextBlock}${restBlock}<div style="height:20px"></div>`;
}
function msgView(){
  const th = myThreads();
  return `<div class="sec"><h2>Messages</h2>${th.length ? `<div class="list">${th.map(x => {
      const last = thread(x.k)[thread(x.k).length - 1], u = unreadFor(x.k, session.user);
      return `<button class="thread" data-chat="${x.w}:${x.t.order}"><span class="ti">${ic(x.w === "cli" ? "user" : "headset")}</span><span class="b"><b>${x.w === "cli" ? esc(x.t.customer) + " · customer" : "Support · " + esc(x.t.title)}</b><small>${last.from === "entregador" ? "You: " : ""}${esc(last.text)}</small></span>${u ? `<span class="ub">${u}</span>` : `<span class="why">${fmtTime(last.when)}</span>`}</button>`;
    }).join("")}</div>` : `<div class="card empty">Chats with customers and support show up here.</div>`}
    <p class="why" style="margin:14px 4px">To message a delivery's customer, open the stop from your Queue.</p></div>`;
}
function euView(){
  const st = statOf(session.user), avg = st.resolved ? Math.round(st.totalMin / st.resolved) : 0, all = mine();
  return `<div class="sec"><h2>Your shift</h2><div class="card" style="padding:4px 18px 18px">
      <dl class="kv"><dt>Completed</dt><dd>${st.resolved}</dd><dt>Avg. time</dt><dd>${avg ? avg + " min" : "—"}</dd>
      <dt>In queue</dt><dd>${all.length} (${all.filter(t => level(t) === "crit").length} critical)</dd></dl></div>
      <div class="btns"><button class="btn soft full" id="out">Sign out</button></div></div>`;
}
const QUICK = {
  cli:["On my way, about 10 minutes out","I'm here, can you come down?","Could you share your delivery code?","I'm at the gate and no one is answering"],
  sac:["On my way","Arrived at the address","Customer isn't answering","Delivery completed"]
};
function chatBox(order){
  const t = S.tasks.find(x => x.order === order && x.area === "operacional"), k = keyOf(who, order), cname = t ? t.customer : "Customer";
  const msgs = thread(k).map(x => x.from === "sistema" ? `<div class="msg sys">${esc(x.text)}</div>` : `<div class="msg ${x.from === "entregador" ? "mine" : "them"}">${esc(x.text)}<small>${x.from === "entregador" ? "You" : esc(x.name) + (who === "sac" ? " · Support" : "")} · ${fmtTime(x.when)}</small></div>`).join("")
    || `<div class="why" style="text-align:center;padding:8px">${who === "cli" ? "Let the customer know when you're close." : "No messages from support about this order."}</div>`;
  const ty = typingNow(k), uO = unreadFor(keyOf(who === "cli" ? "sac" : "cli", order), session.user);
  markRead(k, session.user);
  return `<div class="card box"><div class="ctabs" role="tablist">
      <button role="tab" aria-selected="${who === "cli"}" class="${who === "cli" ? "on" : ""}" data-who="cli">${ic("user")}${esc(cname.split(" ")[0])}${who !== "cli" && uO ? `<span class="ub">${uO}</span>` : ""}</button>
      <button role="tab" aria-selected="${who === "sac"}" class="${who === "sac" ? "on" : ""}" data-who="sac">${ic("headset")}Support${who !== "sac" && uO ? `<span class="ub">${uO}</span>` : ""}</button></div>
    <div class="msgs" id="msgs">${msgs}${ty ? `<div class="typing">${esc(ty)} is typing…</div>` : ""}</div>
    <div class="callrow"><button class="btn soft full" data-call="${who}:${order}" style="min-height:44px">${ic("phone")}Call ${who === "cli" ? esc(cname.split(" ")[0]) : "support"}</button></div>
    <div class="quick">${QUICK[who].map(q => `<button data-quick="${q}">${q}</button>`).join("")}</div>
    <form class="compose" id="compose" data-order="${order}"><input id="txt" autocomplete="off" placeholder="${who === "cli" ? "Message the customer" : "Reply to support"}" aria-label="Message"><button class="btn" type="submit">Send</button></form></div>`;
}
const mmss = s => String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
function openCall(name, sub, k){
  const box = document.getElementById("call"); let s = 0, muted = false, spk = false;
  box.innerHTML = `<div class="av">${initials(name)}</div><h2>${esc(name)}</h2><p>${esc(sub)}</p><div class="tm" id="ctm">Calling…</div><p id="cst">The number stays private: the call goes through the hub.</p>
    <div class="cbtns"><button class="cb" id="cmute" aria-label="Mute">${ic("mic")}</button><button class="cb" id="cspk" aria-label="Speaker">${ic("speaker")}</button><button class="cb end" id="chang" aria-label="End call">${ic("hang")}</button></div>
    <div class="note">Simulated call in this prototype.</div>`;
  box.classList.remove("hidden"); clearInterval(callTimer);
  const t0 = setTimeout(() => { const st = document.getElementById("cst"); if(!st) return; st.textContent = "On call"; callTimer = setInterval(() => { s++; const el = document.getElementById("ctm"); if(el) el.textContent = mmss(s); }, 1000); }, 1800);
  document.getElementById("cmute").onclick = e => { muted = !muted; e.currentTarget.classList.toggle("on", muted); };
  document.getElementById("cspk").onclick = e => { spk = !spk; e.currentTarget.classList.toggle("on", spk); };
  document.getElementById("chang").onclick = () => {
    clearTimeout(t0); clearInterval(callTimer); box.classList.add("hidden"); box.innerHTML = "";
    S = load(); thread(k).push({ from:"sistema", name:"", text:`Call with ${name} ended` + (s ? " · " + mmss(s) : ", no answer"), when:Date.now() }); save(S); render();
  };
}
function detailView(t){
  const isDel = t.type === "Delivery";
  let body = `${chip(t)} <span class="why">${why(t)}</span>
    <dl class="kv"><dt>${isDel ? "Order" : "Batch"}</dt><dd>${t.title}</dd>`;
  body += isDel ? `<dt>Customer</dt><dd>${t.customer}</dd><dt>Phone</dt><dd>${t.phone}</dd><dt>Address</dt><dd>${t.detail}</dd>` : `<dt>Contents</dt><dd>${t.detail}</dd><dt>Expected</dt><dd>${t.expected} packages</dd>`;
  body += `</dl>${navBtns(t)}`;
  if(t.blocked) body += `<div class="alert">${blockedLabel(t)}</div>`;
  if(t.status !== "doing") body += `<div class="btns"><button class="btn full" data-start="${t.id}">${isDel ? "Start route" : "Start receiving"}</button></div>`;
  else if(isDel){
    body += `<div class="card box code"><h3>Delivery code</h3><input id="cod" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" aria-label="4-digit code">
        <div class="hint">Ask the customer for the 4-digit code (demo: ${t.code}).</div><div class="err" id="err">${pending}</div>
        <button class="btn full" data-confirm="${t.id}">Confirm delivery</button></div>
      <div class="card box"><h3>Couldn't deliver</h3><select id="why"><option value="">Pick a reason</option><option>Customer not home, reschedule</option><option>Address not found</option><option>Customer refused</option></select>
        <button class="btn danger full" data-fail="${t.id}" style="margin-top:10px">Report problem</button></div>`;
  } else {
    body += `<div class="card box code"><h3>Packages checked</h3><input id="cnt" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="0" style="letter-spacing:.1em" aria-label="Packages checked">
        <div class="hint">Expected: ${t.expected} packages.</div><div class="err" id="err">${pending}</div>
        <button class="btn full" data-count="${t.id}">Confirm receiving</button></div>`;
  }
  if(isDel && t.order) body += chatBox(t.order);
  return `<div class="dh"><button id="back" aria-label="Back">${ic("back")}</button><b>${isDel ? "Delivery" : "Receiving"}</b></div><div class="db" id="db">${body}</div>`;
}
function chatOnlyView(order){
  const t = mine().find(x => x.order === order);
  return `<div class="dh"><button id="back" aria-label="Back">${ic("back")}</button><b>${who === "cli" ? (t ? esc(t.customer) : "Customer") : "Support · " + (t ? t.title : order)}</b></div><div class="db" id="db">${chatBox(order)}${t ? `<div class="btns"><button class="btn soft full" data-open="${t.id}">View delivery</button></div>` : ""}</div>`;
}

function render(){
  if(!session) return;
  const st = statOf(session.user), all = mine(), u = unreadTotal();
  const draft = document.getElementById("txt") ? document.getElementById("txt").value : "", hadFocus = document.activeElement && document.activeElement.id === "txt";
  const keepDb = document.getElementById("db") ? document.getElementById("db").scrollTop : 0;
  document.getElementById("av").textContent = initials(session.name);
  document.getElementById("hello").innerHTML = `Hi, ${session.name.split(" ")[0]}<small>${new Date().toLocaleDateString("en-US",{weekday:"long"})} · fulfillment center SEA-1</small>`;
  document.getElementById("nums").innerHTML = `<div class="num"><b>${all.length}</b><span>in queue</span></div><div class="num"><b>${all.filter(t => level(t)==="crit").length}</b><span>critical</span></div><div class="num"><b>${st.resolved}</b><span>completed</span></div>`;
  document.getElementById("nFila").innerHTML = ic("list") + "Queue"; document.getElementById("nEu").innerHTML = ic("user") + "Me";
  document.getElementById("nMsg").innerHTML = ic("chat") + "Messages" + (u ? `<span class="ub">${u}</span>` : "");
  ["Fila","Msg","Eu"].forEach(n => document.getElementById("n" + n).classList.toggle("on", tab === ({Fila:"fila",Msg:"msg",Eu:"eu"})[n]));
  const keep = scr.scrollTop; scr.innerHTML = tab === "fila" ? filaView() : tab === "msg" ? msgView() : euView(); scr.scrollTop = keep;
  const t = detId && S.tasks.find(x => x.id === detId);
  if(t && t.status !== "done"){ det.classList.remove("hidden"); det.innerHTML = detailView(t); }
  else if(chatOrder){ det.classList.remove("hidden"); det.innerHTML = chatOnlyView(chatOrder); }
  else { det.classList.add("hidden"); det.innerHTML = ""; if(t) detId = null; }
  const db = document.getElementById("db"); if(db) db.scrollTop = chatOrder ? db.scrollHeight : keepDb;
  const tx = document.getElementById("txt"); if(tx){ tx.value = draft; if(hadFocus){ tx.focus(); } }
}
function sendFromApp(order, text){
  if(!text.trim()) return; sendMsg(keyOf(who, order), "entregador", session.name, text);
  if(who === "cli"){ const t = S.tasks.find(x => x.order === order && x.area === "operacional"); if(t) simulateRecipient(t, render); }
  const tx = document.getElementById("txt"); if(tx) tx.value = ""; render();
}

document.getElementById("nFila").onclick = () => { tab = "fila"; detId = null; chatOrder = null; render(); };
document.getElementById("nMsg").onclick = () => { tab = "msg"; detId = null; chatOrder = null; render(); };
document.getElementById("nEu").onclick = () => { tab = "eu"; detId = null; chatOrder = null; render(); };
appEl.addEventListener("submit", e => { if(e.target.id === "compose"){ e.preventDefault(); sendFromApp(e.target.dataset.order, document.getElementById("txt").value); } });
appEl.addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-tipo],[data-start],[data-confirm],[data-count],[data-fail],[data-chat],[data-quick],[data-who],[data-call],#back,#out");
  if(!t) return; const d = t.dataset;
  if(d.quick){ const f = document.getElementById("compose"); if(f) sendFromApp(f.dataset.order, d.quick); return; }
  if(d.tipo){ tipo = d.tipo; render(); return; }
  if(d.who){ who = d.who; render(); const db = document.getElementById("db"); if(db) db.scrollTop = db.scrollHeight; return; }
  if(d.call){ const [w, order] = d.call.split(":"), k = S.tasks.find(x => x.order === order && x.area === "operacional"); openCall(w === "cli" ? k.customer : "Support hub", w === "cli" ? "Customer · " + k.title : "Customer Service · " + k.title, keyOf(w, order)); return; }
  if(d.chat){ const [w, order] = d.chat.split(":"); who = w; chatOrder = order; detId = null; render(); return; }
  if(d.open){ detId = d.open; chatOrder = null; pending = ""; who = "cli"; render(); return; }
  if(t.id === "back"){ detId = null; chatOrder = null; pending = ""; render(); return; }
  if(t.id === "out"){ logout(); return; }
  if(d.start){ startTask(d.start, session.user); pending = ""; render(); return; }
  if(d.confirm){
    const k = S.tasks.find(x => x.id === d.confirm), v = document.getElementById("cod").value.trim();
    if(v !== k.code){ pending = "Wrong code. Check it with the customer."; render(); return; }
    finishTask(k.id, session.user); if(k.order && thread("ent:" + k.order).length) sendMsg("ent:" + k.order, "entregador", session.name, "Delivery completed with the customer's code.");
    detId = null; pending = ""; render(); toast("Delivery confirmed."); return;
  }
  if(d.count){
    const k = S.tasks.find(x => x.id === d.count), v = parseInt(document.getElementById("cnt").value, 10);
    if(isNaN(v)){ pending = "Enter the number of packages checked."; render(); return; }
    finishTask(k.id, session.user, v !== k.expected ? `mismatch: ${v} of ${k.expected} packages` : ""); detId = null; pending = ""; render();
    toast(v !== k.expected ? "Receiving logged with a mismatch." : "Receiving confirmed."); return;
  }
  if(d.fail){
    const r = document.getElementById("why").value; if(!r){ pending = "Pick a reason."; render(); return; }
    failTask(d.fail, session.user, r); detId = null; pending = ""; render(); toast("Problem reported. Your manager was notified."); return;
  }
});
addEventListener("storage", e => { if(e.key === KEY){ const before = session ? unreadTotal() : 0; S = load(); if(!document.activeElement.matches("#cod,#cnt,select")) render(); if(session && unreadTotal() > before) toast("New message."); } });
setInterval(() => { if(session && !document.activeElement.matches("input,select")){ S = load(); render(); } }, 20000);

function start(){ document.getElementById("login").style.display = "none"; appEl.classList.remove("hidden"); appEl.style.display = "flex"; S = load(); render(); }
if(session){ const a = accountOf(session.user); if(a && a.role === "operacional" && !isBlocked(session.user)) start(); }
</script>
</body>
</html>
